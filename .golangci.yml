# NatPunch 保守 lint 配置（阶段四 F4-1，v2：CI lint 门禁定稿）
# 门禁聚焦高信号检查：vet / staticcheck（安全与正确性相关）。
# gosimple/unused/ineffassign 为上游存量风格债（百级噪音），已按类别禁用；
# 老代码 errcheck 噪音同样不在门禁范围（阶段三已对关键路径逐步补齐读写检查）。
run:
  timeout: 10m

linters:
  disable:
    - errcheck
    - gosimple
    - unused
    - ineffassign

issues:
  exclude-rules:
    # 集成测试（build tag 隔离，默认不编译）；保留文件级规则避免误报
    - path: lib/natpunch_mux/mux_test.go
      linters:
        - staticcheck
    # SA6002：[]byte 池化传值属常见惯例（避免分配的建议性提示），非缺陷
    - linters:
        - staticcheck
      text: "SA6002"
    # SA1019：sing 的 shadowsocks.Handler 接口签名本身用的就是已弃用的 M.Metadata
    # （上游在 v0.7.6 里标了 "deprecated: wtf is this?"，却仍在自己的接口里用），
    # 我们要实现这个接口就绕不开。文件里已经把它收口成 ssMetadata 一个别名，
    # 所以这条豁免实际上只管那一行。
    - path: server/proxy/shadowsocks.go
      linters:
        - staticcheck
      text: "SA1019"
