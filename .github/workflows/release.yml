name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Shell syntax check
        run: |
          sh -n install.sh
          sh -n install_server.sh

      - name: Unit tests (exclude integration)
        run: go test ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Golangci-lint
        run: |
          # 官方预编译 golangci-lint（旧工具链编译）无法解析 Go 1.26 项目的 export data
          # （exit 3 运行崩溃）。改为用当前 setup-go 的 Go 1.26 现场编译，
          # 保证 export data 解码器与项目 Go 版本一致（本地同链路验证 lint 全绿）。
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=10m

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            type: server
          - goos: linux
            goarch: arm64
            type: server
          - goos: linux
            goarch: arm
            goarm: '7'
            type: server
          - goos: linux
            goarch: mipsle
            type: server
          - goos: linux
            goarch: amd64
            type: client
          - goos: linux
            goarch: arm64
            type: client
          - goos: linux
            goarch: arm
            goarm: '7'
            type: client
          - goos: linux
            goarch: mipsle
            type: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          CGO_ENABLED: 0
          GOPROXY: https://goproxy.cn,direct
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          TAG=${GITHUB_REF_NAME}
          mkdir -p out
          if [ "${{ matrix.type }}" = "server" ]; then
            go build -ldflags "-s -w -extldflags -static -X github.com/NekoBoxHQ/NatPunch/lib/version.VERSION=$TAG" \
              -o out/natpunch ./cmd/natpunch/natpunch.go
            BIN="$(pwd)/out/natpunch"
            mkdir -p pkg
            cp out/natpunch pkg/natpunch
            cp -r conf pkg/conf
            cp -r web pkg/web
            cd pkg
            tar -czf ../linux_${{ matrix.goarch }}_server.tar.gz .
          else
            go build -ldflags "-s -w -extldflags -static -X github.com/NekoBoxHQ/NatPunch/lib/version.VERSION=$TAG" \
              -o out/natpunch-client ./cmd/npc/npc.go
            BIN="$(pwd)/out/natpunch-client"
            tar -czf linux_${{ matrix.goarch }}_client.tar.gz -C out natpunch-client
          fi
          # 架构自检：产物架构必须与矩阵声明一致，不一致立即失败，防止坏包发布
          FILE_OUT="$(file -b "$BIN")"
          case "$FILE_OUT" in
            *x86-64*)
              [ "${{ matrix.goarch }}" = "amd64" ] || { echo "::error 架构校验失败: 声明 ${{ matrix.goarch }} 但产物是 amd64"; exit 1; } ;;
            *aarch64*)
              [ "${{ matrix.goarch }}" = "arm64" ] || { echo "::error 架构校验失败: 声明 ${{ matrix.goarch }} 但产物是 arm64"; exit 1; } ;;
            *ARM*)
              [ "${{ matrix.goarch }}" = "arm" ] || { echo "::error 架构校验失败: 声明 ${{ matrix.goarch }} 但产物是 arm"; exit 1; } ;;
            *MIPS*)
              [ "${{ matrix.goarch }}" = "mipsle" ] || { echo "::error 架构校验失败: 声明 ${{ matrix.goarch }} 但产物是 mips"; exit 1; } ;;
            *)
              echo "::error 架构校验失败: 无法识别产物架构 $BIN -> $FILE_OUT"
              exit 1 ;;
          esac
          echo "架构校验通过: ${{ matrix.goarch }} -> $FILE_OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: natpunch_${{ matrix.goos }}_${{ matrix.goarch }}_${{ matrix.type }}
          path: |
            *.tar.gz

  minisign-check:
    # 静态签名校验器：OpenWrt 等无 minisign 软件包的环境，由安装脚本下载本工具做签名校验。
    # Go 版（go-minisign 库），静态交叉编译覆盖全部发布架构。
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64, arm, mipsle]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build minisign-check
        env:
          CGO_ENABLED: 0
          GOPROXY: https://goproxy.cn,direct
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarch == 'arm' && '7' || '' }}
        run: |
          # -buildvcs=false -trimpath：剔除嵌入的 git 提交信息与绝对路径，使产物跨 VCS 状态可复现。
          # Go 默认 -buildvcs=true 会把 revision/modified 编进二进制，导致本地构建出的
          # MSC_SHA256_* 锚点与 CI 在 tag 上的构建产物必然不同（锚点形同虚设）。
          go build -buildvcs=false -trimpath -ldflags "-s -w -extldflags -static" -o minisign-check ./cmd/minisign-check
          file -b minisign-check

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minisign-check-linux-${{ matrix.goarch }}
          path: minisign-check

  release:
    needs: [build, minisign-check]
    runs-on: ubuntu-latest
    steps:
      # 必须 checkout：下面的信任锚守卫要读取 install.sh / install_server.sh。
      # 缺此步骤时守卫会因文件不存在而静默走 warning 分支，等于没有校验。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect tarballs
        run: |
          mkdir -p dist
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          # 收集各架构静态校验器，按 artifact 目录名（minisign-check-linux-<arch>）重命名
          find artifacts -type f -name "minisign-check" | while read -r f; do
            cp "$f" "dist/$(basename "$(dirname "$f")")"
          done
          ls -la dist/

      - name: Generate checksums
        run: |
          cd dist
          # 包与静态校验器一并入哈希清单（校验器哈希由脚本内嵌信任锚比对；SHA256SUMS 同时作为包哈希基线）
          sha256sum *.tar.gz minisign-check-linux-* > SHA256SUMS
          cat SHA256SUMS

      - name: Verify pinned checker hashes (install scripts)
        run: |
          # install.sh / install_server.sh 里的 MSC_SHA256_* 是内置校验器的信任锚（防镜像替换校验器）。
          # 空值 → 给出可粘贴的哈希（提示该架构尚未启用锚定）；非空但与本次产物不符 → 直接失败，
          # 避免发布出错误锚点（错误的锚只会导致降级告警，但会掩盖真实篡改信号）。
          fail=0
          summary=""
          for arch in amd64 arm64 arm mipsle; do
            f="dist/minisign-check-linux-$arch"
            if [ ! -f "$f" ]; then
              echo "::error::缺少构建产物 $f"
              fail=1
              continue
            fi
            actual=$(sha256sum "$f" | awk '{print $1}')
            summary="${summary}MSC_SHA256_${arch}=\"${actual}\"\n"
            for script in install.sh install_server.sh; do
              pinned=$(grep -E "^MSC_SHA256_${arch}=" "$script" | head -1 | cut -d'"' -f2)
              if [ -z "$pinned" ]; then
                echo "::warning::$script 的 MSC_SHA256_${arch} 为空（该架构不启用内置校验器）"
              elif [ "$pinned" != "$actual" ]; then
                echo "::error::$script 的 MSC_SHA256_${arch} 与本次构建产物不符（锚点 $pinned / 实际 $actual），请更新后重新打 tag"
                fail=1
              fi
            done
          done
          # 把本次产物对应的锚点写进 job summary，方便直接粘贴到两个脚本
          {
            echo "### 本次构建的校验器信任锚（可直接粘贴到 install.sh / install_server.sh）"
            echo '```'
            printf "%b" "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: Sign checksums (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          cd dist
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            # C 版 minisign（apt）：与安装脚本校验侧同一实现，避免 go-minisign 子目录版本解析问题
            sudo apt-get update -qq
            sudo apt-get install -y -qq minisign
            printf '%s' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
            chmod 600 /tmp/minisign.key
            minisign -Sm SHA256SUMS -s /tmp/minisign.key
            rm -f /tmp/minisign.key
            ls -la SHA256SUMS.minisig
          else
            echo "::warning::MINISIGN_SECRET_KEY 未配置，跳过 minisign 签名（仅发布 SHA256SUMS）"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
            dist/minisign-check-linux-*
          generate_release_notes: true
          body: |
            ## NatPunch ${{ github.ref_name }}

            ### 安装
            - 服务端：`sh -c "$(wget -qO- https://raw.githubusercontent.com/NekoBoxHQ/NatPunch/master/install_server.sh)"`
            - 客户端：面板一键安装命令

            ### 校验
            - 发布物附 `SHA256SUMS`（强制校验）与 `SHA256SUMS.minisig`（minisign 签名，目标机无签名工具时自动使用随包发布的静态校验器）

      - name: Notify Telegram Group
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(printf '<b>NatPunch %s 已发布</b>\n\n🔧 NAT 设备 内网穿透\n🖥️ 平台: OpenWrt / Linux\n🔗 项目: %s' \
            "${GITHUB_REF_NAME}" \
            "https://github.com/NekoBoxHQ/NatPunch")
          curl -s -m 30 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML"
