name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Unit tests (exclude integration)
        run: go test ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # v1.61 无法解析 Go 1.26 项目的 export data（运行崩溃 exit 3），
          # 需与 Go 1.26 兼容的 v1.64.8+（本地同版本验证 lint 全绿）
          version: v1.64.8
          args: --timeout=10m

  integration:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Integration tests (mux, needs docker+tc; skipped when unavailable)
        run: go test -tags integration ./lib/nps_mux/ -timeout 20m

  build:
    needs: integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            type: server
          - goos: linux
            goarch: arm64
            type: server
          - goos: linux
            goarch: arm
            goarm: '7'
            type: server
          - goos: linux
            goarch: mipsle
            type: server
          - goos: linux
            goarch: amd64
            type: client
          - goos: linux
            goarch: arm64
            type: client
          - goos: linux
            goarch: arm
            goarm: '7'
            type: client
          - goos: linux
            goarch: mipsle
            type: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          CGO_ENABLED: 0
          GOPROXY: https://goproxy.cn,direct
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          TAG=${GITHUB_REF_NAME}
          mkdir -p out
          if [ "${{ matrix.type }}" = "server" ]; then
            go build -ldflags "-s -w -extldflags -static -X ehang.io/nps/lib/version.VERSION=$TAG" \
              -o out/natpunch ./cmd/nps/nps.go
            BIN="$(pwd)/out/natpunch"
            mkdir -p pkg
            cp out/natpunch pkg/natpunch
            cp -r conf pkg/conf
            cp -r web pkg/web
            cd pkg
            tar -czf ../linux_${{ matrix.goarch }}_server.tar.gz .
          else
            go build -ldflags "-s -w -extldflags -static -X ehang.io/nps/lib/version.VERSION=$TAG" \
              -o out/natpunch-client ./cmd/npc/npc.go
            BIN="$(pwd)/out/natpunch-client"
            tar -czf linux_${{ matrix.goarch }}_client.tar.gz -C out natpunch-client
          fi
          # 架构自检：产物架构必须与矩阵声明一致，不一致立即失败，防止坏包发布
          FILE_OUT="$(file -b "$BIN")"
          case "$FILE_OUT" in
            *x86-64*)
              [ "${{ matrix.goarch }}" = "amd64" ] || { echo "::error 架构校验失败: 声明 ${{ matrix.goarch }} 但产物是 amd64"; exit 1; } ;;
            *aarch64*)
              [ "${{ matrix.goarch }}" = "arm64" ] || { echo "::error 架构校验失败: 声明 ${{ matrix.goarch }} 但产物是 arm64"; exit 1; } ;;
            *ARM*)
              [ "${{ matrix.goarch }}" = "arm" ] || { echo "::error 架构校验失败: 声明 ${{ matrix.goarch }} 但产物是 arm"; exit 1; } ;;
            *MIPS*)
              [ "${{ matrix.goarch }}" = "mipsle" ] || { echo "::error 架构校验失败: 声明 ${{ matrix.goarch }} 但产物是 mips"; exit 1; } ;;
            *)
              echo "::error 架构校验失败: 无法识别产物架构 $BIN -> $FILE_OUT"
              exit 1 ;;
          esac
          echo "架构校验通过: ${{ matrix.goarch }} -> $FILE_OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: natpunch_${{ matrix.goos }}_${{ matrix.goarch }}_${{ matrix.type }}
          path: |
            *.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect tarballs
        run: |
          mkdir -p dist
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          ls -la dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Sign checksums (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          cd dist
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            go install github.com/jedisct1/go-minisign/cmd/minisign@v0.1.0
            printf '%s' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
            chmod 600 /tmp/minisign.key
            "$(go env GOPATH)/bin/minisign" -Sm SHA256SUMS -s /tmp/minisign.key
            rm -f /tmp/minisign.key
            ls -la SHA256SUMS.minisig
          else
            echo "::warning::MINISIGN_SECRET_KEY 未配置，跳过 minisign 签名（仅发布 SHA256SUMS）"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
          generate_release_notes: true
          body: |
            ## NatPunch ${{ github.ref_name }}

            NatPunch 是基于 [ehang-io/nps](https://github.com/ehang-io/nps)（GPLv3）的修改版，版权与修改范围见 LICENSE 与 NOTICE。

            ### 安装
            - 服务端：`sh -c "$(wget -qO- https://raw.githubusercontent.com/NekoBoxHQ/NatPunch/master/install_server.sh)"`
            - 客户端：面板一键安装命令

            ### 校验
            - 发布物附 `SHA256SUMS`（强制校验）与 `SHA256SUMS.minisig`（minisign 签名，本机有签名工具时校验）

      - name: Notify Telegram Group
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(printf '<b>NatPunch %s 已发布</b>\n\n🔧 NAT 设备 内网穿透\n🖥️ 平台: OpenWrt / Linux\n🔗 项目: %s' \
            "${GITHUB_REF_NAME}" \
            "https://github.com/NekoBoxHQ/NatPunch")
          curl -s -m 30 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML"
