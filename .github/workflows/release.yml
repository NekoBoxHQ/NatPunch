name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GUI_DIR: cmd/npc/npc-gui
  FRONTEND_DIR: cmd/npc/npc-gui/frontend
  WAILS_VERSION: v3.0.0-beta.12
  APP_NAME: npc-gui

jobs:

  # ==================== 跨平台服务端/客户端打包 ====================
  build_assets:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: "1.22"
      - name: Check out code
        uses: actions/checkout@v2
      - name: Get dependencies
        run: |
          go get -v -t -d ./...
          if [ -f Gopkg.toml ]; then
              curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
              dep ensure
          fi
      - name: Build
        run: |
          chmod +x build.assets.sh
          ./build.assets.sh
      - name: Upload
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            freebsd_386_client.tar.gz
            freebsd_386_server.tar.gz
            freebsd_amd64_client.tar.gz
            freebsd_amd64_server.tar.gz
            freebsd_arm_client.tar.gz
            freebsd_arm_server.tar.gz
            linux_386_client.tar.gz
            linux_386_server.tar.gz
            linux_amd64_client.tar.gz
            linux_amd64_server.tar.gz
            linux_arm64_client.tar.gz
            linux_arm64_server.tar.gz
            linux_arm_v5_client.tar.gz
            linux_arm_v6_client.tar.gz
            linux_arm_v7_client.tar.gz
            linux_arm_v5_server.tar.gz
            linux_arm_v6_server.tar.gz
            linux_arm_v7_server.tar.gz
            linux_mips64le_client.tar.gz
            linux_mips64le_server.tar.gz
            linux_mips64_client.tar.gz
            linux_mips64_server.tar.gz
            linux_mipsle_client.tar.gz
            linux_mipsle_server.tar.gz
            linux_mips_client.tar.gz
            linux_mips_server.tar.gz
            darwin_amd64_client.tar.gz
            darwin_amd64_server.tar.gz
            darwin_arm64_client.tar.gz
            darwin_arm64_server.tar.gz
            windows_386_client.tar.gz
            windows_386_server.tar.gz
            windows_amd64_client.tar.gz
            windows_amd64_server.tar.gz
            npc_sdk.tar.gz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Android APK ====================
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build
        run: |
          chmod +x build.android.sh
          docker run --rm -i -w /app -v $(pwd):/app -e ANDROID_HOME=/usr/local/android_sdk -e GOPROXY=direct fyneio/fyne-cross:android-latest /app/build.android.sh
          ls -la android_client.apk
      - name: Upload
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            android_client.apk
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Docker 镜像 ====================
  build_docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push nps
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.nps
          platforms: linux/amd64,linux/arm,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nps:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nps:${{ env.RELEASE_VERSION }}
      - name: Build and push npc
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.npc
          platforms: linux/amd64,linux/arm,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/npc:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/npc:${{ env.RELEASE_VERSION }}

  # ==================== Windows GUI ====================
  build_windows_gui:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: windows/386
            os_name: windows
            arch: 386
          - platform: windows/amd64
            os_name: windows
            arch: amd64
          - platform: windows/arm64
            os_name: windows
            arch: arm64
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/yarn.lock
      - name: Enable Yarn (corepack)
        run: corepack enable
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GUI_DIR }}/go.mod
          check-latest: true
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
        working-directory: ${{ env.GUI_DIR }}
      - name: Build and package (Windows)
        shell: pwsh
        working-directory: ${{ env.GUI_DIR }}
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.arch }}"
          wails3 build --tags npcgui
          Set-Location bin
          $zipName = "$env:APP_NAME-${{ matrix.os_name }}-${{ matrix.arch }}.zip"
          $exe = Get-ChildItem -Path . -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Host "No build output found in bin"
            Get-ChildItem -Path . | Format-Table -AutoSize
            exit 1
          }
          Compress-Archive -Path $exe.Name -DestinationPath $zipName -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds-${{ matrix.arch }}
          path: ${{ env.GUI_DIR }}/bin/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.zip
      - name: Upload Windows release asset
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.GUI_DIR }}/bin/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== macOS GUI ====================
  build_macos_gui:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: darwin/amd64
            os_name: darwin
            arch: amd64
            os: macos-14
          - platform: darwin/arm64
            os_name: darwin
            arch: arm64
            os: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/yarn.lock
      - name: Enable Yarn (corepack)
        run: corepack enable
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GUI_DIR }}/go.mod
          check-latest: true
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
        working-directory: ${{ env.GUI_DIR }}
      - name: Build and package (macOS)
        shell: bash
        working-directory: ${{ env.GUI_DIR }}
        run: |
          export GOOS=darwin
          export GOARCH="${{ matrix.arch }}"
          # wails3 package builds with EXTRA_TAGS=npcgui (Package has no --tags
          # flag; the var flows into the build dep) and then assembles a proper
          # bin/npc-gui.app bundle with ad-hoc codesign.
          wails3 package EXTRA_TAGS=npcgui
          cd bin
          # Guard the .app lookups so a no-match does not abort the script
          # under `set -e -o pipefail`; keep the raw-binary fallback as safety.
          app="$(ls -1d *.app 2>/dev/null | head -n 1 || true)"
          if [ -z "$app" ]; then
            app="$(find . -maxdepth 1 -type f -perm -111 -exec basename {} \; | head -n 1 || true)"
          fi
          if [ -z "$app" ]; then
            echo "No build output found in bin"
            ls -la
            exit 1
          fi
          zip -q -r "$APP_NAME-${{ matrix.os_name }}-${{ matrix.arch }}.zip" "$app"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds-${{ matrix.arch }}
          path: ${{ env.GUI_DIR }}/bin/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.zip
      - name: Upload macOS release asset
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.GUI_DIR }}/bin/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Linux GUI ====================
  build_linux_gui:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os_name: linux
            arch: amd64
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libjavascriptcoregtk-6.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/yarn.lock
      - name: Enable Yarn (corepack)
        run: corepack enable
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GUI_DIR }}/go.mod
          check-latest: true
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
        working-directory: ${{ env.GUI_DIR }}
      - name: Build and package (Linux)
        shell: bash
        working-directory: ${{ env.GUI_DIR }}
        run: |
          export GOOS=linux
          export GOARCH="${{ matrix.arch }}"
          wails3 build --tags npcgui
          cd bin
          bin="$(find . -maxdepth 1 -type f -perm -111 -printf '%f\n' | head -n 1)"
          if [ -z "$bin" ]; then
            echo "No executable file found in bin"
            ls -la
            exit 1
          fi
          zip -q "$APP_NAME-${{ matrix.os_name }}-${{ matrix.arch }}.zip" "$bin"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds-${{ matrix.arch }}
          path: ${{ env.GUI_DIR }}/bin/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.zip
      - name: Upload Linux release asset
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.GUI_DIR }}/bin/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
