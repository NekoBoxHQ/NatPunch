#HTTP(S) proxy port, no startup if empty
http_proxy_ip=0.0.0.0
http_proxy_port=80
https_proxy_port=443
# 是否展示非【80】端口
show_http_proxy_port=true
##bridge
bridge_type=tcp
bridge_port=8024
bridge_ip=0.0.0.0

# Public password, which clients can use to connect to the server
# After the connection, the server will be able to open relevant ports and parse related domain names according to its own configuration file.
# 自用版：默认关闭公共密钥，避免占用客户端最小可用 ID
#public_vkey=123

# 客户端/隧道数量上限（0=不限，沿用存量语义；推荐 max_clients=100、max_tunnels_per_client=20，见文档）
max_clients=0
max_tunnels_per_client=0

# 全局并发连接数上限（0=不限，沿用存量语义；推荐 10000，见文档）
max_global_conn=0

# mux 写队列排队上限（包数，0=不限；默认 16384 约 64MB，千兆级大流量下防批量掉线）
mux_write_queue_max=16384

#Traffic data persistence interval(minute)
#Ignorance means no persistence
flow_store_interval=1

# log level LevelEmergency->0  LevelAlert->1 LevelCritical->2 LevelError->3 LevelWarning->4 LevelNotice->5 LevelInformational->6 LevelDebug->7
log_level=6
log_path=natpunch.log

#Whether to restrict IP access, true or false or ignore
#ip_limit=true


#web
web_host=a.o.com
web_username=admin
web_password=123
web_port = 8081
web_ip=0.0.0.0
web_base_url=
web_open_ssl=false
web_cert_file=conf/server.pem
web_key_file=conf/server.key
# if web under proxy use sub path. like http://host/natpunch need this.
#web_base_url=/natpunch

#allow_ports=9001-9009,10001,11000-12000

#Web management multi-user login
allow_user_login=true
allow_user_register=false
allow_user_change_username=true

#extension
#流量限制
allow_flow_limit=true
#带宽限制
allow_rate_limit=true
#客户端最大隧道数限制
allow_tunnel_num_limit=true
allow_local_proxy=false
#客户端最大连接数
allow_connection_num_limit=true
#每个隧道监听不同的服务端端口
allow_multi_ip=true
system_info_display=true

#获取用户真实ip
http_add_origin_header=true

#cache
http_cache=false
http_cache_length=100

#get origin ip
#http_add_origin_header=false

#pprof debug options
#pprof_ip=0.0.0.0
#pprof_port=9999

#client disconnect timeout
disconnect_timeout=60

#管理面板开启验证码校验
open_captcha=false

# GitHub OAuth 登录（仅管理员），默认关闭。
# 开启后登录页出现「使用 GitHub 登录」，只有 github_admin_login 白名单里的账号能登录，
# 且只能拿到管理员会话。四个键**缺任意一个即视为未启用**（fail-closed）。
# 配置步骤见 docs/config-reference.md 的「GitHub OAuth 登录」。
github_oauth_enable=false
github_client_id=
github_client_secret=
# 必须与 GitHub OAuth App 里登记的 Authorization callback URL 完全一致；
# 留空则按当前请求推导（跳转时日志会打印推导结果，照抄去登记即可）
github_callback_url=
# 允许通过 GitHub 登录的账号用户名，逗号分隔，不区分大小写
github_admin_login=


# 是否开启tls
tls_enable=true
tls_bridge_port=8025
