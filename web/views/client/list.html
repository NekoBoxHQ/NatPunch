<div class="wrapper wrapper-content animated fadeInRight">

    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5 langtag="page-clientlist"></h5>

                    <div class="ibox-tools">
                        <a class="collapse-link">
                            <i class="fa fa-chevron-up"></i>
                        </a>
                        <a class="close-link">
                            <i class="fa fa-times"></i>
                        </a>
                    </div>
                </div>
            <div class="content">
            {{if eq true .isAdmin}}

                <div class="table-responsive">
                    <div id="toolbar">
                        <a href="{{.web_base_url}}/client/add" class="btn btn-primary dim">
                        <i class="fa fa-fw fa-lg fa-plus"></i> <span langtag="word-add"></span></a>
                        <a href="#" onclick="batchDelete('{{.web_base_url}}/client/del');return false;" class="btn btn-danger dim">
                        <i class="fa fa-fw fa-lg fa-trash"></i> <span langtag="word-batchdelete"></span></a>
                        <!-- 切源：部署命令从哪儿取 install.sh。默认 GitHub，点一下切成面板自建源 -->
                        <button type="button" id="np_src_btn" class="btn btn-outline btn-default"
                                style="margin-left:8px;"
                                title="部署命令的来源：GitHub / 面板自建源">切源：GitHub</button>
                    </div>
                    <table id="taskList_table" class="table-striped table-hover" data-mobile-responsive="true"></table>
                </div>
            </div>
            {{end}}
                <div class="ibox-content">

                    <table id="table"></table>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // npEsc：拼 HTML 字符串前必须用。这些字段（Remark/WebUserName/Basic 账号密码）
    // **可能由客户端自报**（bridge 的 NEW_CONF 路径），原样拼进 detailFormatter 就是
    // 存储型 XSS：任意持 vkey 的客户端写 remark=<img onerror=...>，管理员展开行即执行。
    // html/template 只保护 {{.x}}，保护不到 JS 里拼出来的字符串。
    function npEsc(s) {
        return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
            return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
        });
    }
    /*bootstrap table*/
    // 「切源」开关：默认走 GitHub（false），勾选后部署命令改指面板自建源。
    // 状态存 localStorage，刷新后保持；formatter 里读这个变量。
    var NP_SRC_KEY = 'np_inst_src';
    var npUsePanel = false;
    try { npUsePanel = localStorage.getItem(NP_SRC_KEY) === '1'; } catch (e) { npUsePanel = false; }
    $('#table').bootstrapTable({
        toolbar: "#toolbar",
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/client/list", // 服务器数据的加载地址
        contentType: "application/x-www-form-urlencoded",
        queryParams: function (params) {
            return {
                "offset": params.offset,
                "limit": params.limit,
                "search": params.search,
                "sort": params.sort,
                "order": params.order
            }
        },
        striped: true, // 设置为true会有隔行变色效果
        search: true,
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,//分页
        sidePagination: 'server',//服务器端分页
        pageNumber: 1,
        pageList: [5, 10, 20, 50],//分页步进值
        detailView: true,
        smartDisplay: true, // 智能显示 pagination 和 cardview 等
        onExpandRow: function () {$('body').setLang ('.detail-view');},
        onPostBody: function (data) { if ($(this)[0].locale != undefined ) $('body').setLang ('#table'); },
        detailFormatter: function (index, row, element) {
            return '<b langtag="word-maxconnections"></b>: ' + row.MaxConn + '&emsp;'
                + '<b langtag="word-curconnections"></b>: ' + row.NowConn + '&emsp;'
                + '<b langtag="word-flowlimit"></b>: ' + row.Flow.FlowLimit + 'MB&emsp;'
                + '<b langtag="word-ratelimit"></b>: ' + row.RateLimit + 'Mbps&emsp;'
                + '<b langtag="word-maxtunnels"></b>: ' + row.MaxTunnelNum + '&emsp;<br/><br/>'
                + '<b langtag="word-webusername"></b>: ' + npEsc(row.WebUserName) + '&emsp;'
                + '<b langtag="word-webpassword"></b>: ' + npEsc(row.WebPassword) + '&emsp;'
                + '<b langtag="word-basicusername"></b>: ' + npEsc(row.Cnf.U) + '&emsp;'
                + '<b langtag="word-basicpassword"></b>: ' + npEsc(row.Cnf.P) + '&emsp;<br/><br/>'
                + '<b langtag="word-connectbyconfig"></b>: <span langtag="word-' + row.ConfigConnAllow + '"></span>&emsp;<br/><br/>'
                + '<b langtag="word-ipwhite"></b>: ' + row.IpWhite + '&emsp;'
                + '<b langtag="word-ipwhitepass"></b>: ' + npEsc(row.IpWhitePass) + '&emsp;<br/>'
                + '<b langtag="word-ipwhitelist"></b>: ' + npEsc(row.IpWhiteList) + '&emsp;<br/>'
                + '<b langtag="word-blackip"></b>: ' + npEsc(row.BlackIpList) + '&emsp;<br/><br/>'
                + '<b langtag="word-createtime"></b>: ' + row.CreateTime + '&emsp;<br/>'
                + '<b langtag="word-lastonlinetime"></b>: ' + row.LastOnlineTime + '&emsp;<br/>'
                + '<b langtag="word-expiretime"></b>: ' + (row.ExpireTime || '<span langtag="info-unrestricted"></span>') + '&emsp;<br/><br/>'
                + '<b langtag="word-quicklycommand"></b>: <span>' + encodeToBase64(npEsc(row.Remark) +'|'+'{{.ip}}:{{.p}}|' + row.VerifyKey + '|false')   + '</span>&emsp;<button class="copy btn btn-info btn-xs" onclick="copyCommand(this)" data-clipboard-text="">复制</button><br/>'
                + '<b langtag="word-tlsquicklycommand"></b>: <span>' + encodeToBase64(npEsc(row.Remark) +'|'+'{{.ip}}:{{.tls_p}}|' + row.VerifyKey + '|true{{if .bridge_fingerprint}}|{{.bridge_fingerprint}}{{end}}')   + '</span>&emsp;<button class="copy btn btn-info btn-xs" onclick="copyCommand(this)" data-clipboard-text="">复制</button><br/>'
                + '<b langtag="word-commandclient"></b>: ' + "<code>{{.clientCmd}} -server={{.ip}}:{{.p}} -vkey=" + npEsc(row.VerifyKey) + " -type=" +{{.bridgeType}} +"</code><button class=\"copy btn btn-info btn-xs\" onclick=\"copyCommand(this)\" data-clipboard-text=\"\">复制</button><br/>"
                + '<b langtag="word-commandclient-tls"></b>: ' + "<code>{{.clientCmd}} -server={{.ip}}:{{.tls_p}} -vkey=" + npEsc(row.VerifyKey) + " -tls_enable=true{{if .bridge_fingerprint}} -tls_fingerprint={{.bridge_fingerprint}}{{end}}</code><button class=\"copy btn btn-info btn-xs\" onclick=\"copyCommand(this)\" data-clipboard-text=\"\">复制</button>"
        },
        //表格的列
        columns: [
            {
                checkbox: true,
                align: 'center',
                valign: 'middle'
            },
            {
                field: 'Id',//域值
                title: '<span langtag="word-id"></span>',//标题
                halign: 'center',
                sortable: true,
                // 默认不勾选：平时用不上，勾选栏（showColumns）里随时能打开。
                visible: false//false表示不显示
            },
            {
                field: 'Remark',//域值
                title: '<span langtag="word-remark"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true,//false表示不显示
                formatter: function (value) {
                    // remark 可以由客户端自报（bridge 的 NEW_CONF 路径），
                    // bootstrap-table 默认按 HTML 渲染 → 不转义就是存储型 XSS。
                    return npEsc(value);
                }
            },
            {
                field: 'Version',//域值
                title: '<span langtag="word-version"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true,//false表示不显示
                formatter: function (value) {
                    // 本列内容由客户端上报（见 bridge 层），未经过入库时的 HTML 转义；
                    // bootstrap-table 默认不转义单元格 → 必须在此显式转义，否则是存储型 XSS。
                    return String(value == null ? '' : value)
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                }
            },
            {
                field: 'VerifyKey',//域值
                title: '<span langtag="word-verifykey"></span>',//标题
                halign: 'center',
                sortable: true,
                // 默认不勾选：密钥平时不用盯着看，敞开在列表里还容易被旁边的人扫到。
                // 勾选栏（showColumns）里随时能打开；要用密钥时展开行里也有完整命令。
                visible: false,//false表示不显示
                formatter: function (value, row, index) {
                    if (!row.NoStore) {
                        return value
                    } else {
                        return '<span langtag="word-publicvkey"></span>'
                    }
                }
            },
            {
                field: 'Addr',//域值
                title: '<span langtag="word-address"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'LocalAddr',//域值
                title: '<span langtag="word-localaddr"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true,//false表示不显示
                formatter: function (value) {
                    // 本列内容由客户端上报（见 bridge 层），未经过入库时的 HTML 转义；
                    // bootstrap-table 默认不转义单元格 → 必须在此显式转义，否则是存储型 XSS。
                    return String(value == null ? '' : value)
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                }
            },
            {
                field: 'InletFlow',//域值
                title: '<span langtag="word-inletflow"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit(row.Flow.InletFlow)
                }
            },
            {
                field: 'ExportFlow',//域值
                title: '<span langtag="word-exportflow"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit(row.Flow.ExportFlow)
                }
            },
            {
                field: 'NowRate',//域值
                title: '<span langtag="word-speed"></span>',//内容
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    return changeunitBit(row.Rate.NowRate) + "/s"
                }
            },
            {
                field: 'Status',//域值
                title: '<span langtag="word-status"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-open"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-connect"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-online"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-offline"></span>'
                    }
                }
            },
            {
                // 隧道单独一栏（原来和部署挤在「查看」里）。按钮小，占 1/4；部署占 3/4。
                field: 'tunnel_btn',
                title: '隧道',
                align: 'center',
                halign: 'center',
                valign: 'middle',
                width: '9%',
                visible: true,
                formatter: function (value, row, index) {
                    return '<a href="{{.web_base_url}}/index/all?client_id=' + row.Id
                        + '" class="btn btn-outline btn-primary" style="white-space:nowrap;padding:5px 10px;" langtag="word-tunnel"></a>'
                }
            },
            {
                field: 'option',//域值
                title: '<span langtag="word-option"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    btn_group = '<div class="btn-group">'

                    {{if eq true .isAdmin}}
                    if (row.Status) {
                        btn_group += '<a onclick="submitform(\'stop\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + row.Id
                        btn_group += ', \'status\': 0})" class="btn btn-outline btn-warning"><i class="fa fa-pause"></i></a>'
                    } else {
                        btn_group += '<a onclick="submitform(\'start\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + row.Id
                        btn_group += ', \'status\': 1})" class="btn btn-outline btn-primary"><i class="fa fa-play"></i></a>'
                    }
                    btn_group += '<a onclick="submitform(\'delete\', \'{{.web_base_url}}/client/del\', {\'id\':' + row.Id
                    btn_group += '})" class="btn btn-outline btn-danger"><i class="fa fa-trash"></i></a>'
                    {{end}}

                    btn_group += '<a href="{{.web_base_url}}/client/edit?id=' + row.Id
                    btn_group += '" class="btn btn-outline btn-info"><i class="fa fa-edit"></i></a>'
                    btn_group += '<a href="{{.web_base_url}}/terminal/index?client_id=' + row.Id
                    btn_group += '" class="btn btn-outline btn-info" title="SSH"><i class="fa fa-terminal"></i></a></div>'
                    return btn_group
                }
            },
            {
                // 原「查看」列改名为「部署」：只放两个部署按钮
                field: 'deploy',
                title: '部署',
                align: 'center',
                halign: 'center',
                valign: 'middle',
                width: '27%',
                visible: true,
                formatter: function (value, row, index) {
                    var dom = location.hostname;
                    var port = "{{if .tls_enable}}{{.tls_p}}{{else}}{{.p}}{{end}}";
                    // ⚠️ tlsFlag **必须加单引号**：install.sh 取的是 TLS_FLAG="$4"，带空格的值
                    // 不加引号会被 shell 拆成两个参数，只有第一个 flag 落进 $4、指纹成了 $5 被丢掉。
                    // v26.10.8 只把指纹写进了字符串、没加引号，等于没修（真机上 TLS_FLAG 只剩
                    // -tls_enable=true，tls_fingerprint 警告照刷）。
                    // 带上桥接证书指纹（F2-2）。上面的「TLS 命令」早就带了，这两个部署按钮一直漏着 ——
                    // 拿它们装的客户端只会警告"TLS 已启用但未配置 tls_fingerprint：仅防被动窃听，
                    // 不防中间人"，实测 24 小时能刷 136 条。两个 flag 用空格分隔，install.sh 逐段校验。
                    var tlsFlag = "{{if .tls_enable}}-tls_enable=true{{if .bridge_fingerprint}} -tls_fingerprint={{.bridge_fingerprint}}{{end}}{{end}}";
                    // install.sh 的来源：
                    //   「切源」开关勾选 → 面板自建源（不访问 GitHub）
                    //   未勾选（默认）  → GitHub raw
                    // 面板地址：install_base_url=auto 时按当前访问域名拼 <origin><web_base_url>/static/dl
                    var instCfg = "{{.install_base_url}}";
                    var instVer = "{{.nb_version}}";
                    var panelBase = instCfg === "auto"
                        ? (location.origin + "{{.web_base_url}}" + "/static/dl")
                        : instCfg;
                    var usePanel = npUsePanel && !!panelBase;
                    var instUrl = usePanel
                        ? panelBase + "/install.sh"
                        : "https://raw.githubusercontent.com/NekoBoxHQ/NatPunch/master/install.sh";
                    // 自建源：把版本目录作为下载基准传给安装脚本（脚本自身不写死任何地址）
                    var instEnv = usePanel ? ("NATPUNCH_BASE_URL=" + panelBase + "/" + instVer + " ") : "";
                    var ow = "uclient-fetch -qO- " + instUrl + " | " + instEnv + "sh -s -- '" + row.VerifyKey + "' " + dom + " " + port + " '" + tlsFlag + "'";
                    var lx = "wget -qO- " + instUrl + " | " + instEnv + "sh -s -- '" + row.VerifyKey + "' " + dom + " " + port + " '" + tlsFlag + "'";
                    // 只放两个部署按钮；隧道已经拆到左边单独一栏
                    // nowrap：两个按钮在窄列里会各占一行，看着像坏掉
                    return '<div class="btn-group" style="display:inline-flex;flex-wrap:nowrap;">'
                        + '<button class="btn btn-outline btn-info deploy-copy" style="white-space:nowrap;padding:5px 9px;" data-clipboard-text="' + ow + '">OpenWrt 部署</button>'
                        + '<button class="btn btn-outline btn-warning deploy-copy" style="white-space:nowrap;padding:5px 9px;" data-clipboard-text="' + lx + '">Linux 部署</button>'
                        + '</div>'
                }
            }
        ]
    });

    function encodeToBase64(str){
        const utf8Str = unescape(encodeURIComponent("natpunch:"+str));
        return btoa(utf8Str);
    }

    function copyCommand(data) {
        data.setAttribute("data-clipboard-text", data.previousElementSibling.innerHTML)
    }

    var clipboard = new ClipboardJS('.copy, .deploy-copy');

    // 「切源」按钮（表格顶部工具栏）：点一下在 GitHub / 面板自建源之间切
    (function () {
        var panelReady = "{{.install_base_url}}" !== "";
        if (!panelReady) { npUsePanel = false; }
        var $b = $('#np_src_btn');
        function paint() {
            if (!panelReady) {
                $b.prop('disabled', true).text('切源：未启用')
                  .attr('title', '面板未配置 install_base_url，只能用 GitHub')
                  .removeClass('btn-primary').addClass('btn-outline btn-default');
                return;
            }
            if (npUsePanel) {
                $b.text('切源：面板').removeClass('btn-outline btn-default').addClass('btn-primary')
                  .attr('title', '当前从面板自建源取安装包（点击切回 GitHub）');
            } else {
                $b.text('切源：GitHub').removeClass('btn-primary').addClass('btn-outline btn-default')
                  .attr('title', '当前从 GitHub 取安装包（点击切到面板自建源）');
            }
        }
        paint();
        $b.on('click', function () {
            if ($(this).prop('disabled')) { return; }
            npUsePanel = !npUsePanel;
            try { localStorage.setItem(NP_SRC_KEY, npUsePanel ? '1' : '0'); } catch (e) {}
            paint();
            $('#table').bootstrapTable('refresh'); // 重算每行的部署命令
        });
    })();
    clipboard.on('success', function (e) {
        // alert("复制成功"+e.text)
        toastr.success('复制成功');
        e.clearSelection();
    });

    clipboard.on('error', function (e) {
        // alert("复制失败")
        toastr.error('复制失败', '提示');
    });


</script>
