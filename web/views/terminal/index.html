<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5 langtag="word-terminal"></h5>
                    <div class="ibox-tools">
                        <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                        <a class="close-link"><i class="fa fa-times"></i></a>
                    </div>
                </div>
                <div class="ibox-content" style="display:flex;align-items:flex-start;">
                    <div style="flex:1;min-width:0;">
                        <div id="term_box" style="height:500px;background:rgba(0,0,0,0.82);border-radius:4px;padding:6px;"></div>
                        <div style="display:flex;margin-top:10px;">
                            <input id="term_input" type="text" placeholder="预输入命令，按 Enter 整行发送" style="flex:1;height:30px;font-size:13px;border:1px solid rgba(51,51,51,0.4);background:transparent;color:#333;padding:0 10px;border-radius:2px;">
                            <button id="term_send" class="btn btn-primary" style="margin-left:6px;height:30px;padding:0 14px;"><span langtag="word-term-send"></span></button>
                        </div>
                    </div>
                    <div id="cmd_panel" style="width:96px;margin-left:10px;border:1px solid rgba(51,51,51,0.25);border-radius:4px;background:transparent;flex-shrink:0;">
                        <div style="padding:5px 6px;border-bottom:1px solid rgba(51,51,51,0.15);text-align:center;">
                            <div style="font-size:13px;color:#333;font-weight:bold;" langtag="word-term-cmd"></div>
                        </div>
                        <div style="padding:6px 6px;">
                            <button id="term_toggle" class="btn btn-sm btn-danger" style="width:100%;margin-bottom:6px;padding:2px 0;font-size:12px;"><span id="term_toggle_txt" langtag="word-term-disconnect"></span></button>
                        </div>
                        <div id="cmd_body" style="padding:0 6px 6px;max-height:380px;overflow-y:auto;">
                            <div id="cmd_list"></div>
                            <div style="display:flex;margin-top:6px;">
                                <input id="cmd_new" type="text" placeholder="+ 添加" style="flex:1;min-width:0;height:22px;font-size:12px;border:1px solid rgba(51,51,51,0.4);background:transparent;color:#333;padding:0 4px;border-radius:2px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<link href="{{.web_base_url}}/static/terminal/xterm.min.css" rel="stylesheet">
<script src="{{.web_base_url}}/static/terminal/xterm.min.js"></script>
<script src="{{.web_base_url}}/static/terminal/xterm-addon-fit.min.js"></script>
<script>
(function () {
    var webBase = '{{.web_base_url}}';
    var initClientId = {{.client_id}};
    var term = null, fitAddon = null, ws = null;
    var boxEl = $('#term_box');
    var CUSTOM_KEY = 'np_term_customs';
    var HIDDEN_KEY = 'np_term_hidden';
    var QUICK_CMDS = [
        {label: 'top', cmd: 'top'},
        {label: 'df -h', cmd: 'df -h'},
        {label: 'free -m', cmd: 'free -m'},
        {label: 'ps', cmd: 'ps aux | head -20'},
        {label: 'ip a', cmd: 'ip a'},
        {label: 'netstat', cmd: 'netstat -tlnp | head -20'},
        {label: 'ping', cmd: 'ping -c 4 baidu.com'},
        {label: '重启网络', cmd: '/etc/init.d/network restart'},
        {label: '跟踪日志', cmd: 'tail -f /var/log/syslog'}
    ];

    function getJson(key) {
        try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; }
    }
    function setJson(key, list) {
        try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {}
    }
    function getCustoms() { return getJson(CUSTOM_KEY); }
    function getHidden() { return getJson(HIDDEN_KEY); }

    function sendLine(cmd) {
        if (ws && ws.readyState === 1) {
            try { ws.send(new TextEncoder().encode(cmd + '\r')); } catch (e) {}
        }
    }

    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function renderCmdPanel() {
        var hidden = getHidden();
        function hiddenCmd(cmd) {
            for (var i = 0; i < hidden.length; i++) { if (hidden[i] === cmd) return true; }
            return false;
        }
        var cmds = [];
        for (var i = 0; i < QUICK_CMDS.length; i++) { if (!hiddenCmd(QUICK_CMDS[i].cmd)) cmds.push(QUICK_CMDS[i]); }
        var customs = getCustoms();
        for (var j = 0; j < customs.length; j++) { if (!hiddenCmd(customs[j].cmd)) cmds.push(customs[j]); }

        var html = '';
        for (var k = 0; k < cmds.length; k++) {
            var c = cmds[k];
            html += '<div class="cmd-row" data-cmd="' + esc(c.cmd) + '" data-label="' + esc(c.label) + '" style="display:flex;align-items:center;margin-bottom:2px;padding:1px 2px;border-radius:2px;">'
                + '<button type="button" class="cmd-run" data-cmd="' + esc(c.cmd) + '" style="flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:none;background:transparent;color:#333;font-size:12px;cursor:pointer;padding:1px 0;">' + c.label + '</button>'
                + '<button type="button" class="cmd-edit" data-cmd="' + esc(c.cmd) + '" style="border:none;background:transparent;color:#888;font-size:10px;cursor:pointer;padding:1px 1px;" title="编辑">✎</button>'
                + '<button type="button" class="cmd-del" data-cmd="' + esc(c.cmd) + '" style="border:none;background:transparent;color:#888;font-size:11px;cursor:pointer;padding:1px 1px;" title="删除">×</button>'
                + '</div>';
        }
        $('#cmd_list').html(html);

        $('#cmd_list').find('.cmd-run').on('click', function () { sendLine($(this).data('cmd')); });

        $('#cmd_list').find('.cmd-del').on('click', function () {
            var cmd = $(this).data('cmd');
            var h = getHidden();
            for (var n = 0; n < h.length; n++) { if (h[n] === cmd) return; }
            h.push(cmd);
            setJson(HIDDEN_KEY, h);
            renderCmdPanel();
        });

        $('#cmd_list').find('.cmd-edit').on('click', function () {
            var row = $(this).closest('.cmd-row');
            var cmd = row.data('cmd'), label = row.data('label');
            row.html('<div style="display:flex;flex-direction:column;width:100%;">'
                + '<input class="edit-label" type="text" value="' + esc(label) + '" style="width:100%;height:18px;font-size:11px;border:1px solid rgba(51,51,51,0.4);background:transparent;color:#333;padding:0 4px;border-radius:2px;margin-bottom:2px;box-sizing:border-box;">'
                + '<div style="display:flex;">'
                + '<input class="edit-cmd" type="text" value="' + esc(cmd) + '" style="flex:1;min-width:0;height:18px;font-size:11px;border:1px solid rgba(51,51,51,0.4);background:transparent;color:#333;padding:0 4px;border-radius:2px;box-sizing:border-box;">'
                + '<button type="button" class="edit-save" style="border:none;background:transparent;color:#23c6c8;font-size:12px;cursor:pointer;padding:0 2px;" title="保存">✓</button>'
                + '</div></div>');
            var save = function () {
                var nl = row.find('.edit-label').val().trim(), nc = row.find('.edit-cmd').val().trim();
                if (!nc) { renderCmdPanel(); return; }
                var customs = getCustoms(), found = false;
                for (var i = 0; i < customs.length; i++) {
                    if (customs[i].cmd === cmd) { customs[i].label = nl || nc; customs[i].cmd = nc; found = true; break; }
                }
                if (!found) {
                    // 内置命令编辑：写入自定义覆盖
                    customs.push({label: nl || nc, cmd: nc, custom: true});
                    var h = getHidden();
                    for (var j = 0; j < h.length; j++) { if (h[j] === cmd) { h.splice(j, 1); break; } }
                    setJson(HIDDEN_KEY, h);
                }
                setJson(CUSTOM_KEY, customs);
                renderCmdPanel();
            };
            row.find('.edit-save').on('click', save);
            row.find('.edit-cmd').on('keydown', function (e) { if (e.key === 'Enter') { save(); } });
        });
    }

    $('#cmd_new').on('keydown', function (e) {
        if (e.key === 'Enter') {
            var cmd = $(this).val().trim();
            if (!cmd) { return; }
            var list = getCustoms();
            for (var i = 0; i < list.length; i++) { if (list[i].cmd === cmd) { $(this).val(''); return; } }
            var h = getHidden();
            for (var j = 0; j < h.length; j++) { if (h[j] === cmd) { h.splice(j, 1); break; } }
            setJson(HIDDEN_KEY, h);
            list.push({label: cmd.split(' ')[0], cmd: cmd, custom: true});
            setJson(CUSTOM_KEY, list);
            $(this).val('');
            renderCmdPanel();
        }
    });

    // 自动连接（从客户端列表进入）
    if (initClientId > 0) {
        doConnect(initClientId);
    }

    function openTerm() {
        if (term) { return; }
        term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            rendererType: 'dom',
            theme: {background: '#000000'}
        });
        fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(boxEl[0]);
        fitAddon.fit();
        term.onData(function (data) {
            if (ws && ws.readyState === 1) {
                try { ws.send(new TextEncoder().encode(data)); } catch (e) {}
            }
        });
    }

    function doConnect(clientId) {
        openTerm();
        closeWs();
        term.reset();
        term.write('\x1b[33mconnecting...\x1b[0m\r\n');
        var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        var cols = term ? term.cols : 80, rows = term ? term.rows : 24;
        var url = proto + location.host + webBase + '/terminal/ws?client_id=' + clientId + '&cols=' + cols + '&rows=' + rows;
        try { ws = new WebSocket(url); } catch (e) { return; }
        ws.binaryType = 'arraybuffer';
        ws.onopen = function () {
            setToggle(true);
            $('#term_input').focus();
        };
        ws.onmessage = function (ev) {
            if (ev.data instanceof ArrayBuffer) {
                term.write(new Uint8Array(ev.data));
            } else {
                term.write(String(ev.data));
            }
        };
        ws.onerror = function () {};
        ws.onclose = function () { setToggle(false); };
    }

    function closeWs() {
        if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} ws = null; }
        setToggle(false);
    }

    function setToggle(connected) {
        var btn = $('#term_toggle_txt');
        if (connected) {
            btn.text('断开');
            btn.closest('button').removeClass('btn-primary').addClass('btn-danger');
        } else {
            btn.text('连接');
            btn.closest('button').removeClass('btn-danger').addClass('btn-primary');
        }
    }

    $('#term_toggle').click(function () {
        if (ws && ws.readyState === 1) {
            closeWs();
        } else {
            if (initClientId > 0) { doConnect(initClientId); }
        }
    });

    $('#term_input').on('keydown', function (e) {
        if (e.key === 'Enter') {
            sendLine($(this).val());
            $(this).val('');
        }
    });

    $('#term_send').click(function () {
        sendLine($('#term_input').val());
        $('#term_input').val('');
    });

    $(window).on('resize', function () {
        if (fitAddon) { try { fitAddon.fit(); } catch (e) {} }
    });

    renderCmdPanel();
})();
</script>
