<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5 langtag="word-terminal"></h5>
                    <div class="ibox-tools">
                        <a id="cmd_panel_toggle" title="折叠/展开快捷命令" style="color:#333;margin-right:10px;cursor:pointer;font-size:13px;"><span id="cmd_panel_toggle_txt">≪</span></a>
                        <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                        <a class="close-link"><i class="fa fa-times"></i></a>
                    </div>
                </div>
                <div id="term_wrap" class="ibox-content" style="display:flex;align-items:flex-start;padding-left:15px;padding-right:0;position:relative;">
                    <div style="flex:1;min-width:0;">
                        <div id="term_box" style="height:500px;background:#000000;border-radius:4px;padding:6px 0 6px 6px;"></div>
                        <div style="display:flex;margin-top:10px;">
                            <input id="term_input" type="text" placeholder="预输入命令，按 Enter 整行发送" style="flex:1;min-width:0;height:32px;font-size:13px;border:1px solid rgba(51,51,51,0.4);background:transparent;color:#333;padding:0 10px;border-radius:2px;box-sizing:border-box;">
                            <button id="term_send" class="btn btn-primary" style="margin-left:6px;height:32px;padding:0 14px;border-radius:0;border:none;"><span langtag="word-term-send"></span></button>
                        </div>
                    </div>
                    <div id="cmd_panel" style="display:none;width:192px;margin-left:0;border-left:1px solid rgba(51,51,51,0.25);border-right:none;background:transparent;flex-shrink:0;">
                        <div style="padding:6px 4px 4px;text-align:center;">
                            <div style="font-size:12px;color:#333;font-weight:bold;" langtag="word-term-cmd"></div>
                            <div id="cmd_count" style="font-size:10px;color:#888;margin-top:1px;"></div>
                        </div>
                        <div id="cmd_body" style="padding:3px;max-height:340px;overflow-y:auto;">
                            <div id="cmd_list"></div>
                            <button id="cmd_add" type="button" style="width:100%;border:none;background:transparent;color:#23c6c8;font-size:12px;padding:5px 0;cursor:pointer;">＋</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="cmd_modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);z-index:9999;align-items:center;justify-content:center;">
    <div style="width:340px;background:rgba(15,20,30,0.94);border-radius:6px;padding:16px 18px;color:#fff;box-sizing:border-box;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <span id="cmd_modal_title" style="font-size:15px;font-weight:bold;">添加命令</span>
            <button id="cmd_modal_close" type="button" style="border:none;background:transparent;color:#aaa;font-size:16px;cursor:pointer;padding:0 4px;">×</button>
        </div>
        <div style="font-size:12px;color:#aaa;margin-bottom:4px;">名称</div>
        <input id="cmd_modal_name" type="text" placeholder="例如：查看容器" style="width:100%;height:28px;font-size:13px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);color:#fff;padding:0 8px;border-radius:3px;box-sizing:border-box;outline:none;">
        <div style="font-size:12px;color:#aaa;margin:10px 0 4px;">命令</div>
        <textarea id="cmd_modal_cmd" placeholder="例如：docker ps" style="width:100%;height:60px;font-size:13px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);color:#fff;padding:6px 8px;border-radius:3px;box-sizing:border-box;resize:none;outline:none;"></textarea>
        <div style="font-size:11px;color:#888;margin:8px 0;">收藏保存在本机浏览器，请勿保存密码、Token、私钥等敏感内容。</div>
        <div style="display:flex;justify-content:flex-end;margin-top:8px;">
            <button id="cmd_modal_cancel" type="button" style="border:1px solid rgba(255,255,255,0.25);background:transparent;color:#ccc;font-size:13px;padding:4px 16px;border-radius:3px;cursor:pointer;">取消</button>
            <button id="cmd_modal_save" type="button" style="border:none;background:#23c6c8;color:#fff;font-size:13px;padding:4px 16px;border-radius:3px;cursor:pointer;margin-left:8px;">保存</button>
        </div>
    </div>
</div>

<link href="{{.web_base_url}}/static/terminal/xterm.min.css" rel="stylesheet">
<style>
.cmd-run:hover { color:#23c6c8 !important; }
.cmd-edit:hover { color:#23c6c8 !important; }
.cmd-del:hover { color:#e74c3c !important; }

/* 窄屏（手机竖屏）：
   - 终端盒子高度跟着视口走，别再固定 500px；
   - 快捷命令面板改成**浮层**叠在终端右侧。它固定宽 192px，在 390px 的屏上
     直接吃掉一半宽度 —— 终端只剩 45 列左右，什么都显示不下。
     （内联样式要用 !important 才盖得住。） */
@media (max-width: 768px) {
    /* 顶到边框：这一页的主要工作区就是终端本身，外围那些留白（#page-wrapper 15px、
       Bootstrap 的 col 15px、.ibox-content 20px、wrapper-content 15px…）加起来
       在 390px 的屏上是六七十像素 —— 换算成终端列数就是十几列，白扔。
       注意 .row 在 Bootstrap 里是负外边距，父容器 padding 归零后必须一起归零，
       否则内容会溢出视口、横向能拖。

       （这些规则写在终端页自己的 <style> 里，只影响这一页，不动别的页面。） */
    #page-wrapper { padding: 0 !important; }
    .wrapper-content { padding: 0 !important; }
    .wrapper-content > .row { margin-left: 0 !important; margin-right: 0 !important; }
    .wrapper-content .col-lg-12 { padding-left: 0 !important; padding-right: 0 !important; }
    .wrapper-content .ibox { margin: 0 !important; border: none !important; }
    .wrapper-content .ibox-title { padding: 8px 10px 6px !important; }
    .wrapper-content .ibox-content { padding: 0 !important; }
    #term_wrap { padding: 0 !important; }
    #term_box { height: 66vh !important; min-height: 300px; border-radius: 0 !important; padding: 4px 0 4px 4px; }
    #cmd_panel {
        position: absolute !important;
        top: 0;
        right: 0;
        width: 64vw !important;
        max-height: 100%;
        overflow-y: auto;
        background: rgba(255,255,255,0.97) !important;
        border-left: 1px solid rgba(51,51,51,0.2) !important;
        box-shadow: -3px 0 12px rgba(0,0,0,0.18);
        z-index: 60;
    }
}
</style>
<script src="{{.web_base_url}}/static/terminal/xterm.min.js"></script>
<script src="{{.web_base_url}}/static/terminal/xterm-addon-fit.min.js"></script>
<script>
(function () {
    var webBase = '{{.web_base_url}}';
    var initClientId = {{.client_id}};
    var term = null, fitAddon = null, ws = null;
    var boxEl = $('#term_box');
    // 快捷命令持久化在面板服务器（conf/quick_cmds.json），所有入口通用
    var SERVER_CMDS = {customs: [], hidden: []};

    function loadCmds() {
        $.get(webBase + '/terminal/getcmds', function (d) {
            if (d && d.customs) { SERVER_CMDS = d; }
            renderCmdPanel();
        }).fail(function () { renderCmdPanel(); });
    }
    function saveCmds() {
        $.ajax({
            url: webBase + '/terminal/savecmds',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(SERVER_CMDS)
        });
    }
    function getCustoms() { return SERVER_CMDS.customs; }
    function getHidden() { return SERVER_CMDS.hidden; }

    function sendLine(cmd) {
        if (ws && ws.readyState === 1) {
            try { ws.send(new TextEncoder().encode(cmd + '\r')); } catch (e) {}
        }
    }

    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;');
    }

    function renderCmdPanel() {
        var hidden = getHidden();
        function hiddenCmd(cmd) {
            for (var i = 0; i < hidden.length; i++) { if (hidden[i] === cmd) return true; }
            return false;
        }
        var cmds = [];
        var customs = getCustoms();
        for (var j = 0; j < customs.length; j++) { if (!hiddenCmd(customs[j].cmd)) cmds.push(customs[j]); }

        $('#cmd_count').text(cmds.length + ' 条命令');

        var html = '';
        for (var k = 0; k < cmds.length; k++) {
            var c = cmds[k];
            html += '<div class="cmd-row" data-cmd="' + esc(c.cmd) + '" data-label="' + esc(c.label) + '" style="display:flex;align-items:center;margin:0;border-bottom:1px solid rgba(51,51,51,0.08);">'
                + '<button type="button" class="cmd-run" data-cmd="' + esc(c.cmd) + '" style="flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:none;background:transparent;color:#333;font-size:12px;cursor:pointer;padding:6px 3px;">' + esc(c.label) + '</button>'
                + '<button type="button" class="cmd-edit" data-cmd="' + esc(c.cmd) + '" data-label="' + esc(c.label) + '" onclick="npCmdEdit(this)" style="flex-shrink:0;border:none;background:transparent;color:#888;font-size:13px;cursor:pointer;padding:6px 4px;line-height:1;" title="编辑">✎</button>'
                + '<button type="button" class="cmd-del" data-cmd="' + esc(c.cmd) + '" onclick="npCmdDel(this)" style="flex-shrink:0;border:none;background:transparent;color:#888;font-size:14px;cursor:pointer;padding:6px 6px;line-height:1;" title="删除">×</button>'
                + '</div>';
        }
        $('#cmd_list').html(html);
    }

    // 全局入口（内联 onclick 双保险）
    window.npCmdDel = function (btn) {
        var cmd = $(btn).data('cmd');
        // 直接从自定义列表移除
        var cs = getCustoms();
        for (var i = 0; i < cs.length; i++) { if (cs[i].cmd === cmd) { cs.splice(i, 1); break; } }
        // 内置命令：加入隐藏列表
        var h = getHidden();
        var inHidden = false;
        for (var j = 0; j < h.length; j++) { if (h[j] === cmd) { inHidden = true; break; } }
        if (!inHidden) { h.push(cmd); }
        saveCmds();
        renderCmdPanel();
    };
    window.npCmdEdit = function (btn) {
        openModal($(btn).data('label'), $(btn).data('cmd'));
    };

    // 事件委托：动态渲染后依然可靠响应
    $(document).on('click', '.cmd-run', function () { sendLine($(this).data('cmd')); });

    $(document).on('click', '.cmd-del', function () {
        window.npCmdDel(this);
    });

    $(document).on('click', '.cmd-edit', function () {
        openModal($(this).data('label'), $(this).data('cmd'));
    });

    // 弹窗添加/编辑
    var editingCmd = '';
    function openModal(label, cmd) {
        editingCmd = cmd || '';
        $('#cmd_modal_title').text(editingCmd ? '编辑命令' : '添加命令');
        $('#cmd_modal_name').val(label || '');
        $('#cmd_modal_cmd').val(cmd || '');
        $('#cmd_modal').css('display', 'flex');
        $('#cmd_modal_name').focus();
    }
    function closeModal() {
        $('#cmd_modal').hide();
        editingCmd = '';
    }
    function saveModal() {
        var label = $('#cmd_modal_name').val().trim();
        var cmd = $('#cmd_modal_cmd').val().trim();
        if (!cmd) { return; }
        if (!label) { label = cmd.split(' ')[0]; }
        var customs = getCustoms();
        if (editingCmd) {
            var found = false;
            for (var i = 0; i < customs.length; i++) {
                if (customs[i].cmd === editingCmd) { customs[i].label = label; customs[i].cmd = cmd; found = true; break; }
            }
            if (!found) {
                customs.push({label: label, cmd: cmd});
            }
        } else {
            // 重名时更新（而不是静默丢弃）
            var found = false;
            for (var m = 0; m < customs.length; m++) {
                if (customs[m].cmd === cmd) { customs[m].label = label; found = true; break; }
            }
            if (!found) {
                customs.push({label: label, cmd: cmd});
            }
        }
        saveCmds();
        closeModal();
        renderCmdPanel();
    }

    $('#cmd_add').on('click', function () { openModal('', ''); });
    $('#cmd_modal_close').on('click', closeModal);
    $('#cmd_modal_cancel').on('click', closeModal);
    $('#cmd_modal_save').on('click', saveModal);
    $('#cmd_modal_cmd').on('keydown', function (e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { saveModal(); }
    });

    // 自动连接（从客户端列表进入）
    if (initClientId > 0) {
        doConnect(initClientId);
    }

    loadCmds();

    function openTerm() {
        if (term) { return; }
        // 窄屏用小一号字，能多挤几列出来
        var narrow = !!(window.matchMedia && window.matchMedia('(max-width: 768px)').matches);
        term = new Terminal({
            cursorBlink: true,
            fontSize: narrow ? 12 : 14,
            fontFamily: 'Consolas, Menlo, Monaco, "DejaVu Sans Mono", "Courier New", monospace',
            rendererType: 'dom',
            theme: {background: '#000000'}
        });
        fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(boxEl[0]);
        fitAddon.fit();
        // 这里原来有一句 `if (term.cols < 80) { term.resize(80, term.rows); }`，
        // 注释写的是"窄容器下 banner 不折行错乱"，实际效果**正好相反**：
        // 手机竖屏时容器只放得下 ~45 列，强行按 80 列渲染 → 每行都溢出再折回来，
        // 整屏变成一团彩色碎块（banner 尤其明显）。
        // 删掉它，让 xterm 按容器真实宽度定列数；真实列数由 sendResize() 的
        // resize 控制帧发给客户端 PTY，ls / top / vim 才会按手机的宽度排版。
        term.onData(function (data) {
            if (ws && ws.readyState === 1) {
                try { ws.send(new TextEncoder().encode(data)); } catch (e) {}
            }
        });
        // 复制：优先剪贴板 API（只有 HTTPS / localhost 有），否则回退 execCommand。
        // 面板多是 http://ip:8081 —— 非安全上下文下 navigator.clipboard 根本不存在，
        // 只剩 execCommand('copy') 这一条路可走。
        function copySelection() {
            if (!term) { return false; }
            var sel = term.getSelection();
            if (!sel) { return false; }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(sel).catch(function () {});
                return true;
            }
            var ta = document.createElement('textarea');
            ta.value = sel;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            var ok = false;
            try { ok = document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            return ok;
        }

        // 右键菜单：**有选中内容就放行浏览器自带菜单**（「复制」可用）；
        // 只有没选中、且剪贴板 API 存在（HTTPS/localhost）时，才当「右键粘贴」。
        // 旧实现无条件 preventDefault，把浏览器菜单整个吃掉 —— 而 HTTP 下面板又拿不到
        // navigator.clipboard（readText 不存在），于是右键既不能复制也不能粘贴，完全失效。
        boxEl[0].addEventListener('contextmenu', function (e) {
            if (term && term.getSelection()) { return; }
            if (!navigator.clipboard || !navigator.clipboard.readText) { return; }
            e.preventDefault();
            navigator.clipboard.readText().then(function (txt) {
                if (txt && ws && ws.readyState === 1) {
                    try { ws.send(new TextEncoder().encode(txt)); } catch (e2) {}
                }
            }).catch(function () {});
        });

        // Ctrl+Shift+C / Ctrl+Insert 复制（Ctrl+C 要留给 SIGINT，不能占用）。
        // 捕获阶段拦下，避免 xterm 再处理一遍。
        boxEl[0].addEventListener('keydown', function (e) {
            var hit = (e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'C' || e.key === 'c');
            if (!hit && e.ctrlKey && e.key === 'Insert') { hit = true; }
            if (hit && copySelection()) { e.preventDefault(); e.stopPropagation(); }
        }, true);
    }

    function doConnect(clientId) {
        openTerm();
        closeWs();
        term.reset();
        var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        var cols = term ? term.cols : 80, rows = term ? term.rows : 24;
        var url = proto + location.host + webBase + '/terminal/ws?client_id=' + clientId + '&cols=' + cols + '&rows=' + rows;
        try { ws = new WebSocket(url); } catch (e) { return; }
        ws.binaryType = 'arraybuffer';
        ws.onopen = function () {
            $('#term_input').focus();
        };
        ws.onmessage = function (ev) {
            if (ev.data instanceof ArrayBuffer) {
                term.write(new Uint8Array(ev.data));
            } else {
                term.write(String(ev.data));
            }
        };
        ws.onerror = function () {};
        ws.onclose = function () {};
    }

    function closeWs() {
        if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} ws = null; }
    }

    // 发送终端尺寸（resize 控制帧）：服务端带外下发给客户端 pty，保持窗口缩放/面板折叠后换行正确
    function sendResize() {
        if (fitAddon) { try { fitAddon.fit(); } catch (e) {} }
        if (ws && ws.readyState === 1 && term) {
            try { ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows })); } catch (e) {}
        }
    }

    // 右上角 × 关闭终端，返回客户端列表
    $('.close-link').on('click', function (e) {
        e.preventDefault();
        closeWs();
        location.href = webBase + '/client/list';
    });

    // 折叠/展开快捷命令面板（默认折叠，SSH 界面占满）
    $('#cmd_panel_toggle').on('click', function (e) {
        e.preventDefault();
        var p = $('#cmd_panel');
        if (p.is(':visible')) {
            p.hide();
            $('#cmd_panel_toggle_txt').text('≪');
        } else {
            p.show();
            $('#cmd_panel_toggle_txt').text('≫');
        }
        sendResize();
    });

    $('#term_input').on('keydown', function (e) {
        if (e.key === 'Enter') {
            sendLine($(this).val());
            $(this).val('');
        }
    });

    $('#term_send').click(function () {
        sendLine($('#term_input').val());
        $('#term_input').val('');
    });

    $(window).on('resize', sendResize);
    // 部分移动端浏览器旋屏只发 orientationchange，且视口尺寸是异步更新的，
    // 直接量会拿到旧的宽度；延一小会儿再 fit。
    $(window).on('orientationchange', function () { setTimeout(sendResize, 300); });
})();
</script>
