<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title langtag="title-login"></title>
    <link rel="icon" type="image/png" href="{{.web_base_url}}/static/img/natpunch-logo.png">

    <!-- Mainly scripts -->
    <!-- Latest compiled and minified CSS -->
    <link href="{{.web_base_url}}/static/css/fontawesome.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/solid.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/bootstrap.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/style.css?v={{.version}}" rel="stylesheet">

    <!-- Latest compiled and minified JavaScript -->
    <script src="{{.web_base_url}}/static/js/jquery-3.4.1.min.js?v={{.version}}"></script>
    <script src="{{.web_base_url}}/static/js/bootstrap.min.js?v={{.version}}"></script>
    <!-- Latest compiled and minified Locales -->
    <script src="{{.web_base_url}}/static/js/language.js?v={{.version}}" type="text/javascript"></script>

</head>

<style>
    /* 登录页：深色玻璃卡片 + 背景图轻微压暗。
       配色仍取自面板主题（#1ab394 / #23c6c8），但卡片走深色，文字/输入框整体翻成浅色 ——
       这样壁纸本身能透出来（背景只压 26%~46%），卡片又不至于糊在亮背景上。 */
    :root {
        --np-primary: #1ab394;
        --np-accent: #23c6c8;
        --np-card-bg: rgba(18, 26, 34, 0.58);
        --np-card-border: rgba(255, 255, 255, 0.16);
        --np-ink: #eef4f8;
        --np-muted: rgba(255, 255, 255, 0.62);
    }

    html, body { height: 100%; }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                     "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #101a24; /* 图没加载出来时的兜底底色 */
    }

    /* 背景图 + 一层柔和的暗色渐晕（较轻）+ 顶部一点主题青色辉光。
       路径不变（static/img/login_bg.jpg），用户自己换的图继续生效。 */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(1200px 620px at 50% -10%, rgba(26, 179, 148, 0.22), transparent 62%),
            linear-gradient(180deg, rgba(8, 15, 22, 0.26), rgba(8, 15, 22, 0.46)),
            url('{{.web_base_url}}/static/img/login_bg.jpg') center/cover no-repeat;
        z-index: -1;
    }

    .np-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 16px;
    }

    .np-card {
        width: 100%;
        max-width: 384px;
        padding: 32px 30px 24px;
        border-radius: 18px;
        background: var(--np-card-bg);
        -webkit-backdrop-filter: blur(20px) saturate(1.2);
        backdrop-filter: blur(20px) saturate(1.2);
        border: 1px solid var(--np-card-border);
        box-shadow: 0 18px 52px rgba(0, 0, 0, 0.42);
        color: var(--np-ink);
        animation: npIn 0.32s ease-out both;
    }
    @keyframes npIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: none; }
    }
    /* 浏览器不支持 backdrop-filter 时（老内核）把卡片调实，别糊在背景上 */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .np-card { background: rgba(18, 26, 34, 0.94); }
    }

    .np-brand { text-align: center; margin-bottom: 22px; }
    .np-brand img {
        width: 66px;
        height: 66px;
        border-radius: 17px;
        box-shadow: 0 8px 22px rgba(26, 179, 148, 0.38);
    }
    .np-brand h1 {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: #f4f9fc;
        margin: 14px 0 5px;
    }
    .np-brand p {
        font-size: 12px;
        color: var(--np-muted);
        margin: 0;
        letter-spacing: 0.2px;
    }

    .np-field { position: relative; margin-bottom: 12px; }
    .np-field > i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.52);
        font-size: 14px;
        pointer-events: none;
    }
    /* 面板全局样式给输入框加过 !important 背景，这里用同等强度压回来 */
    .np-input {
        width: 100% !important;
        height: 46px !important;
        padding: 0 14px 0 40px !important;
        font-size: 14px !important;
        color: var(--np-ink) !important;
        background: rgba(255, 255, 255, 0.10) !important;
        border: 1px solid rgba(255, 255, 255, 0.16) !important;
        border-radius: 10px !important;
        box-shadow: none !important;
        outline: none !important;
        transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        box-sizing: border-box;
    }
    .np-input::placeholder { color: rgba(255, 255, 255, 0.55); }
    .np-input:focus {
        border-color: var(--np-primary) !important;
        background: rgba(255, 255, 255, 0.15) !important;
        box-shadow: 0 0 0 3px rgba(26, 179, 148, 0.26) !important;
    }
    /* 自动填充：默认会把框涂成黄/白，深色卡片上很突兀 —— 用内阴影盖成深色 */
    .np-input:-webkit-autofill,
    .np-input:-webkit-autofill:hover,
    .np-input:-webkit-autofill:focus {
        -webkit-text-fill-color: var(--np-ink) !important;
        -webkit-box-shadow: 0 0 0 1000px #1b2a38 inset !important;
        transition: background-color 5000s ease-in-out 0s;
    }

    .np-btn {
        width: 100%;
        height: 46px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #fff;
        background: linear-gradient(135deg, var(--np-primary), var(--np-accent));
        box-shadow: 0 6px 18px rgba(26, 179, 148, 0.38);
        cursor: pointer;
        transition: filter 0.15s, box-shadow 0.15s, transform 0.1s;
    }
    .np-btn:hover { filter: brightness(1.07); box-shadow: 0 9px 24px rgba(26, 179, 148, 0.46); }
    .np-btn:active { transform: translateY(1px); }

    .np-or {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 16px 0 12px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.46);
    }
    .np-or::before,
    .np-or::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
    }

    /* GitHub 按钮保持白底：深色卡片上一块干净的白，识别度最高（品牌色不宜挪用） */
    .np-gh {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.94);
        color: #24292f !important;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.15s, box-shadow 0.15s;
    }
    .np-gh:hover,
    .np-gh:focus {
        background: #fff;
        box-shadow: 0 3px 14px rgba(0, 0, 0, 0.22);
        color: #24292f !important;
        text-decoration: none;
    }
    .np-gh svg { flex: 0 0 auto; }

    .np-link {
        display: block;
        margin-top: 14px;
        text-align: center;
        font-size: 13px;
        color: #6ee0c8 !important;
        text-decoration: none;
    }
    .np-link:hover { text-decoration: underline; }

    .np-foot {
        margin-top: 18px;
        text-align: center;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.48);
    }

    /* 右上角语言切换：半透明小胶囊（浅底页面上用白色，深色卡片旁也不抢眼） */
    .np-lang {
        position: fixed;
        top: 18px;
        right: 20px;
        z-index: 10;
    }
    #languagemenu {
        display: inline-flex !important;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 13px !important;
        border: 1px solid rgba(255, 255, 255, 0.4) !important;
        border-radius: 999px !important;
        background: rgba(255, 255, 255, 0.82) !important;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        color: #3b4754 !important;
        font-size: 13px !important;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.16) !important;
    }
    #languagemenu:hover { background: #fff !important; }
    #languagemenu .fa { font-size: 14px !important; }
    .np-lang .dropdown-menu {
        right: 0;
        left: auto;
        min-width: 132px;
        margin-top: 6px;
        padding: 6px;
        border: none;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    }
    .np-lang .dropdown-menu > li > a {
        border-radius: 7px;
        font-size: 13px;
        padding: 7px 10px;
        color: #3b4754;
    }
    .np-lang .dropdown-menu > li > a:hover { background: rgba(26, 179, 148, 0.10); }

    /* 窄屏：卡片贴边一点，语言按钮别压住卡片 */
    @media (max-width: 420px) {
        .np-card { padding: 26px 20px 20px; border-radius: 15px; }
        .np-lang { top: 12px; right: 12px; }
    }
</style>

<body>
<div class="np-lang">
    <span class="dropdown">
        <button id="languagemenu" class="btn dropdown-toggle" type="button" data-toggle="dropdown"
                aria-haspopup="true" aria-expanded="false"><i class="fa fa-globe-asia"></i><span></span></button>
        <ul class="dropdown-menu"></ul>
    </span>
</div>

<div class="np-wrap">
    <div class="np-card">
        <div class="np-brand">
            <img src="{{.web_base_url}}/static/img/natpunch-logo.png" alt="NatPunch">
            <h1>NatPunch</h1>
            <p>无公网设备管理平台</p>
        </div>

        {{if .oauth_error}}
            <div id="oauthError" data-msg="{{.oauth_error}}" style="display:none;"></div>
        {{end}}

        <form onsubmit="return false">
            <div class="np-field">
                <i class="fa fa-user"></i>
                <input name="username" class="np-input" placeholder="username" required=""
                       langtag="word-username" autocomplete="username">
            </div>
            <div class="np-field">
                <i class="fa fa-lock"></i>
                <input name="password" type="password" class="np-input" placeholder="password" required=""
                       langtag="word-password" autocomplete="current-password">
            </div>
            {{if eq true .captcha_open}}
                <div class="np-field">
                    {{create_captcha}}
                    <input name="captcha" class="np-input" placeholder="captcha" required=""
                           langtag="word-captcha">
                </div>
            {{end}}

            <button onclick="login()" class="np-btn" type="button" langtag="word-login"></button>

            {{if eq true .github_oauth_enable}}
                <p class="np-or" style="margin-bottom:12px;"><small langtag="word-or"></small></p>
                <a class="np-gh" href="{{.web_base_url}}/login/github">
                    <!-- GitHub 图标：官方 octicon mark-github-16（16x16，取自 @primer/octicons），
                         内联在这里是为了不引入字体图标库或外部资源依赖。 -->
                    <svg viewBox="0 0 16 16" width="19" height="19" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
                    <span langtag="word-github-login"></span>
                </a>
            {{end}}

            {{if eq true .register_allow}}
                <a class="np-link" href="{{.web_base_url}}/login/register" langtag="word-register"></a>
            {{end}}
        </form>

        <div class="np-foot">© 2026 无公网设备静默管理平台</div>
    </div>
</div>

<script type="text/javascript">
    window.natpunch = {"web_base_url": "{{.web_base_url}}", "version": "{{.version}}" }

    // Login Page Flipbox control
    function login() {
        $.ajax({
            type: "POST",
            url: "{{.web_base_url}}/login/verify",
            data: $("form").serializeArray(),
            success: function (res) {
                if (res.status) {
                    window.location.href = "{{.web_base_url}}/index/index"
                } else {
                    alert(res.msg)
                }
            }
        })
        return false
    }

    // GitHub 登录失败的原因：服务端按错误码查表得出文案，渲染在 #oauthError 的 data-msg 上。
    // 刻意**不**在这里读 URL 上的 oauth_error —— 那等于让人能在真登录页上弹出任意文字
    // （/login/index?oauth_error=账号已停用…），是个社会工程载荷。表里没有的码服务端给空串，
    // 这个 div 就整个不会被渲染，也就不会弹任何东西。
    (function () {
        var el = document.getElementById('oauthError')
        if (el && el.getAttribute('data-msg')) { alert(el.getAttribute('data-msg')) }
    })()
</script>
</body>
</html>
