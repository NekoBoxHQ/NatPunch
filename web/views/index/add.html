<div class="row tile">
    <div class="col-md-12 col-md-auto">
        <div class="ibox float-e-margins">
            <h3 class="ibox-title" langtag="page-add"></h3>
            <div class="ibox-content">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="control-label font-bold" langtag="word-scheme"></label>
                        <div class="col-sm-10">
                            <span class="help-block m-b-none font-bold" langtag="word-usecase"></span>:
                            <span id="usecase">
                                <span id="casetcpudp" langtag="info-casetcpudp"></span>
                                <span id="casehttpProxy" langtag="info-casehttpproxy"></span>
                                <span id="casesocks5" langtag="info-casesocks5"></span>
                            </span>
                            <!-- 模式由进来的入口决定（新增隧道 / 新增HTTP代理 / 新增SOCKD代理），
                                 再放一个下拉让人选是多余的。这里只把值带上，取值不变。 -->
                            <input type="hidden" name="type" id="type" value="{{.type}}">
                        </div>
                    </div>

                    <div class="form-group" id="client_id">
                        <label class="control-label font-bold" langtag="word-client"></label>
                        <div class="col-sm-10">
                            <select class="form-control" name="client_id" placeholder="" id="natpunch_client_id"
                                    langtag="word-belongclient"></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="control-label font-bold" langtag="word-remark"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="remark" placeholder="备注">
                        </div>
                    </div>

                    <div class="form-group" id="port">
                        <label class="control-label font-bold" langtag="word-serverport"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="port" placeholder=""
                                   langtag="info-suchasport">
                            <span class="help-block m-b-none" id="port_tip"></span>
                        </div>
                    </div>

                    <div class="form-group" id="target">
                        <label class="control-label font-bold" langtag="word-target"></label>
                        <div class="col-sm-10">
                            <textarea class="form-control" name="target" rows="4" placeholder=""
                                      langtag="info-suchasiplist"></textarea>
                            <span class="help-block m-b-none" langtag="info-targettunnel"></span>
                        </div>
                    </div>

                    <div class="form-group" id="access_path">
                        <label class="control-label font-bold" langtag="word-accesspath"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="access_path" placeholder="/ui">
                            <span class="help-block m-b-none" langtag="info-accesspath"></span>
                        </div>
                    </div>

                    <div class="form-group" id="https">
                        <label class="control-label font-bold" langtag="word-https"></label>
                        <div class="col-sm-10">
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" name="https" value="true">
                                    <span langtag="info-https"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" id="username">
                        <label class="control-label font-bold" langtag="word-username"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="username" placeholder=""
                                   langtag="info-unrestricted">
                            <span class="help-block m-b-none" langtag="info-proxyaccount"></span>
                        </div>
                    </div>

                    <div class="form-group" id="password">
                        <label class="control-label font-bold" langtag="word-password"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="password" name="password" placeholder=""
                                   langtag="info-unrestricted">
                        </div>
                    </div>

                    <div class="hr-line-dashed"></div>
                    <div class="form-group">
                        <div class="col-sm-4 col-sm-offset-2">
                            <button class="btn btn-success" type="button"
                                    onclick="submitform('add', '{{.web_base_url}}/index/add', $('form').serializeArray())">
                                <i class="fa fa-fw fa-lg fa-check-circle"></i> <span langtag="word-add"></span>
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
<script>
    var arr = []
    arr["all"] = ["client_id", "port", "target", "username", "password"]
    arr["tcp+udp"] = ["client_id", "port", "target", "access_path", "https"]
    arr["socks5"] = ["client_id", "port", "username", "password"]
    arr["httpProxy"] = ["client_id", "port", "username", "password"]

    // 只在白名单里挑模式。这个值一头要拿去拼选择器、一头会随表单提交存成隧道的 Mode，
    // 拿任意字符串去拼是危险的：里面带个 '#' / '&' 就能让 jQuery 的选择器直接抛错。
    var KNOWN_MODES = {"tcp": 1, "udp": 1, "tcp+udp": 1, "httpProxy": 1, "socks5": 1};

    function resetForm() {
        $(".form-group[id]").css("display", "none");
        $("#usecase span").css("display", "none");
        // **只从隐藏域的 value 属性读**（浏览器解析属性时会把 &#43; 这类实体还原成 '+'）。
        // 不要去读模板渲染进 <script> 里的 '{{.type}}' —— 脚本里实体不还原，
        // 拿到的是字面量 "tcp&#43;udp"，拼出来的选择器 #casetcp&#43;udp 会抛异常，
        // 后面所有逻辑（包括兜底）全都执行不到。下面再做一次归一化兜底。
        o = String($("#type").val() || "").replace(/&#43;/g, "+").replace(/\s+/g, "+");
        o = $.trim(o);
        if (!KNOWN_MODES[o]) {
            o = "tcp+udp";
        }
        $("#type").val(o); // 干净的写回表单，提交上去的才是有效的 Mode
        $('#case' + o).css("display", "inline")
        $("#port_tip").html("")
        if (o == "tcp+udp") {
            $("#port_tip").html("同一端口同时监听 TCP 和 UDP")
        }
        for (var i = 0; i < arr[o].length; i++) {
            $("#" + arr[o][i]).css("display", "block")
        }
    }

    $(function () {
        // 不再从模板往脚本里塞值：隐藏域的 value 属性已经带着它了（属性里的实体浏览器会还原）。
        // 空值由 resetForm 里的白名单兜底成 tcp+udp。
        resetForm()
        $("#use_client").on("change", function () {
            resetForm()
        })

        getClientList()
    })

    function getClientList() {
        $("select[name='client_id']").empty();
        $.ajax({
            type: "POST",
            url: "{{.web_base_url}}/client/list", // 服务器数据的加载地址
            data: {order: "asc", offset: 0, limit: 999},
            dataType: "json",
            success: function (data) {
                if (data && data.rows.length > 0) {
                    for (var i = 0; i < data.rows.length; i++) {
                        var option = "<option value=\"" + data.rows[i].Id + "\"";
                        option += ">" + data.rows[i].Remark + "</option>"; //只显示备注名，取值仍是 Id
                        $("select[name='client_id']").append(option);
                        $("select[name='client_id']").find("option[value='{{.client_id}}']").attr("selected", true);
                    }
                }
            }
        });
    }
</script>
