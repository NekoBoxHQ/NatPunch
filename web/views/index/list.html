<div class="wrapper wrapper-content animated fadeInRight">

    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5><span id="langtag"></span><span></span></h5>

                    <div class="ibox-tools">
                        <a class="collapse-link">
                            <i class="fa fa-chevron-up"></i>
                        </a>
                        <a class="close-link">
                            <i class="fa fa-times"></i>
                        </a>
                    </div>
                </div>
                <div class="content">
                    <div class="table-responsive">
                        <div id="toolbar">
                            <a href="{{.web_base_url}}/index/add?type={{.type}}&client_id={{.client_id}}" class="btn btn-primary dim">
                            <i class="fa fa-fw fa-lg fa-plus"></i> <span langtag="word-add"></span></a>
                            <a href="#" onclick="batchDelete('{{.web_base_url}}/index/del');return false;" class="btn btn-danger dim">
                            <i class="fa fa-fw fa-lg fa-trash"></i> <span langtag="word-batchdelete"></span></a>
                        </div>
                        <table id="taskList_table" class="table-striped table-hover" data-mobile-responsive="true"></table>
                    </div>
                </div>
                <div class="ibox-content">

                    <table id="table"></table>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    name = '{{.name}}:'.replace(/\s*/g,"")
    $('#langtag').attr('langtag','page-list' + name.replace(/:.*/,"")).next().text(name.split(":")[1])

    /*bootstrap table*/
    $('#table').bootstrapTable({
        toolbar: "#toolbar",
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/index/gettunnel", // 服务器数据的加载地址
        queryParams: function (params) {
            return {
                "offset": params.offset,
                "limit": params.limit,
                "type":{{.type}},
                "client_id":{{.client_id}},
                "search": params.search,
                "sort": params.sort,
                "order": params.order
            }
        },
        search: true,
        contentType: "application/x-www-form-urlencoded",
        striped: true, // 设置为true会有隔行变色效果
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,//分页
        sidePagination: 'server',//服务器端分页
        pageNumber: 1,
        pageList: [5, 10, 20, 50],//分页步进值
        detailView: true,
        smartDisplay: true, // 智能显示 pagination 和 cardview 等
        onExpandRow: function () {$('body').setLang ('.detail-view');},
        onLoadSuccess:function (data) {$('body').setLang ('.detail-view');},
        onPostBody: function (data) {
            if ($(this)[0].locale != undefined ) $('body').setLang ('#table');
        },
        detailFormatter: function (index, row, element) {
            tmp = '<b langtag="word-exportflow"></b>: ' + changeunit(row.Flow.ExportFlow) + '&emsp;'
                    + '<b langtag="word-inletflow"></b>: ' + changeunit(row.Flow.InletFlow) + '&emsp;'
                    + '<b langtag="word-crypt"></b>: ' + row.Client.Cnf.Crypt + '&emsp;'
                    + '<b langtag="word-compress"></b>: ' + row.Client.Cnf.Compress + '&emsp;'
                    + '<b langtag="word-basicusername"></b>: ' + row.Client.Cnf.U + '&emsp;'
                    + '<b langtag="word-basicpassword"></b>: ' + row.Client.Cnf.P + '&emsp;'
                    + '<b langtag="word-protoversion"></b>: ' + row.ProtoVersion + '&emsp;'
            var copyBtn = '<button class="copy btn btn-info btn-xs" onclick="copyCommand(this)" data-clipboard-text="">复制</button>'
            return tmp
        },
        //表格的列
        columns: [
            {
                checkbox: true,
                align: 'center',
                valign: 'middle'
            },
            {
                field: 'Id',//域值
                title: '<span langtag="word-id"></span>',//标题
                halign: 'center',
                // 默认不勾选：这一列显示的是**行号**（见下面的 formatter），不是真实 Id，
                // 平时没什么用。勾选栏（showColumns）里随时能打开。
                visible: false,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    var opt = $('#table').bootstrapTable('getOptions');
                    return (opt.pageNumber - 1) * opt.pageSize + index + 1;
                }
            },
            {
                field: 'ClientId',//域值
                title: '<span langtag="word-client"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    // 只改显示，不动取值：field 仍是 ClientId（排序/筛选照旧）
                    return row.Client.Remark
                }
            },
            {
                field: 'Remark',//域值
                title: '<span langtag="word-remark"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'Client.VerifyKey',//域值
                title: '<span langtag="word-verifykey"></span>',//标题
                halign: 'center',
                sortable: true, //启用排序
                // 默认不勾选：密钥平时不用盯着看，敞开在列表里还容易被旁边的人扫到。
                // 勾选栏（showColumns）里随时能打开。
                visible: false//false表示不显示
            },
            {
                field: 'Mode',//域值
                title: '<span langtag="word-scheme"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (value == 'tcp+udp') { return '<span langtag="scheme-tcpudp"></span>' }
                    return '<span langtag="scheme-' + value + '"></span>'
                }
            },
            {
                field: 'address',//域值
                title: '<span langtag="word-accessaddress"></span>',//标题
                halign: 'center',
                sortable: false, //计算列，按 Port 排序即可
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    // 代理类（SOCKS / HTTP / Shadowsocks）没有一个能点的 http(s) 地址，
                    // 只显示公网 IP；Shadowsocks 的可用入口是下面那个复制 ss:// 按钮。
                    if (row.Mode == 'socks5' || row.Mode == 'httpProxy' || row.Mode == 'shadowsocks') {
                        return {{.ip}}
                    }
                    var scheme = (row.Https) ? "https" : "http"
                    var address = scheme + "://" + {{.ip}} + ":" + row.Port
                    if (row.AccessPath) { address += row.AccessPath }
                    return "<a href='" + address + "' target='_blank' style='color:#333;text-decoration:none'>" + address + "</a>"
                }
            },
            {
                field: 'Port',//域值
                title: '<span langtag="word-port"></span>',//标题
                halign: 'center',
                sortable: true, //启用排序
                visible: true//false表示不显示
            },
            {
                field: 'Username',//域值
                title: '<span langtag="word-username"></span>',//标题
                halign: 'center',
                sortable: false,
                // 隧道管理页隐藏；Shadowsocks 没有用户名这个概念，也隐藏
                visible: '{{.type}}' !== 'tcp+udp' && '{{.type}}' !== 'shadowsocks',
                formatter: function (value, row, index) {
                    if (row.MultiAccount && row.MultiAccount.AccountMap) {
                        for (var k in row.MultiAccount.AccountMap) { return k }
                    }
                    return ''
                }
            },
            {
                field: 'Password2',//域值
                title: '<span langtag="word-password"></span>',//标题
                halign: 'center',
                sortable: false,
                // 这一列显示的是 MultiAccount 里的密码；Shadowsocks 的密钥不在这儿
                // （它走 ss:// 链接复制），所以也隐藏
                visible: '{{.type}}' !== 'tcp+udp' && '{{.type}}' !== 'shadowsocks',
                formatter: function (value, row, index) {
                    if (row.MultiAccount && row.MultiAccount.AccountMap) {
                        for (var k in row.MultiAccount.AccountMap) { return row.MultiAccount.AccountMap[k] }
                    }
                    return ''
                }
            },
            {
                field: 'Status',//域值
                title: '<span langtag="word-status"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-open"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'RunStatus',//域值
                title: '<span langtag="word-runstatus"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-open"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-clientstatus"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    if (row.Client.IsConnect) {
                        return '<span class="badge badge-primary" langtag="word-online"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-offline"></span>'
                    }
                }
            },
            {
                field: 'option',//域值
                title: '<span langtag="word-option"></span>',//内容
                align: 'center',
                halign: 'center',
                width: '200px',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    btn_group = '<div class="btn-group">'
                    if (row.Status) {
                        btn_group += "<a onclick=\"submitform('stop', '{{.web_base_url}}/index/stop', {'id':" + row.Id
                        btn_group += '})" class="btn btn-outline btn-warning"><i class="fa fa-pause"></i></a>'
                    } else {
                        btn_group += "<a onclick=\"submitform('start', '{{.web_base_url}}/index/start', {\'id\':" + row.Id
                        btn_group += '})" class="btn btn-outline btn-primary"><i class="fa fa-play"></i></a>'
                    }
                    btn_group += "<a onclick=\"submitform('delete', '{{.web_base_url}}/index/del', {'id':" + row.Id
                    btn_group += '})" class="btn btn-outline btn-danger"><i class="fa fa-trash"></i></a>'

                    btn_group += '<a  href="{{.web_base_url}}/index/edit?id=' + row.Id
                    btn_group += '" class="btn btn-outline btn-info"><i class="fa fa-edit"></i></a>'

                    // 导出链接的名称：取**隧道自己的备注**（导入后就是节点名），
                    // 退而取客户端备注只是为了不出现空名称 —— 同一客户端下多条隧道时，
                    // 客户端备注会把它们全导成同一个名字，分不出来。三种代理共用一份。
                    var linkName = row.Remark || (row.Client && row.Client.Remark) || ''

                    if (row.Mode == 'socks5' || row.Mode == 'httpProxy') {
                        var un = ''; var pw = ''
                        if (row.MultiAccount && row.MultiAccount.AccountMap) {
                            for (var k in row.MultiAccount.AccountMap) { un = k; pw = row.MultiAccount.AccountMap[k] }
                        }
                        var scheme = row.Mode == 'socks5' ? 'socks5' : 'http'
                        var link = scheme + '://' + un + ':' + pw + '@' + {{.ip}} + ':' + row.Port
                        if (linkName) { link += '#' + encodeURIComponent(linkName) }
                        btn_group += '<button class="btn btn-outline btn-info copylink" data-clipboard-text="' + link + '"><i class="fa fa-link"></i></button>'
                    }
                    if (row.Mode == 'shadowsocks') {
                        // SIP002：整个 userinfo（method:password）做 **websafe-base64（无填充）**，
                        // 直接当用户名用。跟 s-ui / sing-box / mihomo 导出的那份完全一致。
                        //
                        // 以前这里写的是 encodeURIComponent('method:psk')，那不是 SIP002 的形态：
                        // 链接里会留着明文的算法名和 `:`，别的面板一眼看出格式不对，导入也挑工具。
                        // 注意 base64 要用 URL-safe（+ → -、/ → _）并去掉 `=` 填充 ——
                        // 这段文本里本来就会带 `+` `/` `=`（内层 PSK 是 base64），照标准表编出来
                        // 在 URL 里是要转义的。
                        var userinfo = btoa('2022-blake3-aes-128-gcm:' + (row.Password || ''))
                            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
                        var ss = 'ss://' + userinfo + '@' + {{.ip}} + ':' + row.Port
                        if (linkName) { ss += '#' + encodeURIComponent(linkName) }
                        btn_group += '<button class="btn btn-outline btn-info copylink" data-clipboard-text="' + ss + '"><i class="fa fa-link"></i></button>'
                    }
                    btn_group += '</div>'
                    return btn_group
                }
            }
        ]
    });

    function copyCommand(data) {
        data.setAttribute("data-clipboard-text", data.previousElementSibling.innerHTML)
    }

    var clipboard = new ClipboardJS('.copy, .copylink');
    clipboard.on('success', function (e) {
        toastr.success('复制成功');
        e.clearSelection();
    });
    clipboard.on('error', function (e) {
        toastr.error('复制失败', '提示');
    });

    // 定时刷新，让流量数字是活的（以前只在打开页面时取一次数，跑完流量再看还是老值）。
    // 3 秒一次；页面在后台不刷。**如果展开了某一行就不刷** —— 那行的展开区里就是流量数字，
    // 整表重绘会把它收起来，等于看着看着被合上。
    setInterval(function () {
        if (document.hidden) {
            return;
        }
        if ($('#table').find('.detail-view').length > 0) {
            return;
        }
        $('#table').bootstrapTable('refresh');
    }, 3000);
</script>
