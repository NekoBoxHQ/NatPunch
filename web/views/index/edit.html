<div class="row tile">
    <div class="col-md-12 col-md-auto">
        <div class="ibox float-e-margins">
            <h3 class="ibox-title" langtag="page-edit"></h3>
            <div class="ibox-content">
                <form class="form-horizontal">
                    <input type="hidden" name="id" value="{{.t.Id}}">
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-scheme"></label>
                        <div class="col-sm-10">
                            <span class="help-block m-b-none font-bold" langtag="word-usecase"></span>:
                            <!-- 同 add.html：显示哪一句由服务端（case_key）决定，不靠前端 show/hide -->
                            <span id="usecase" langtag="{{.case_key}}"></span>
                            <!-- 模式在这里是**固定**的：这条隧道是什么类型，上面那行「使用场景」已经写清楚了。
                                 从哪个入口建的就在哪个入口用，编辑时不该再让人换类型。
                                 （TCP隧道 / UDP隧道 两个模式已弃用 —— 双端隧道默认就是同一端口同时吃 TCP 和 UDP。） -->
                            <input type="hidden" name="type" id="type" value="{{.t.Mode}}">
                        </div>
                    </div>

                    <div class="form-group" id="client_id">
                        <label class="col-sm-2 control-label font-bold" langtag="word-client"></label>
                        <div class="col-sm-10">
                            <select class="form-control" name="client_id" id="natpunch_client_id"></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-remark"></label>
                        <div class="col-sm-10">
                            <input value="{{.t.Remark}}" class="form-control" type="text" name="remark" placeholder=""
                                   langtag="info-unrestricted">
                        </div>
                    </div>

                    <div class="form-group" id="port">
                        <label class="col-sm-2 control-label font-bold" langtag="word-serverport"></label>
                        <div class="col-sm-10">
                            <input value="{{.t.Port}}" class="form-control" type="text" name="port" placeholder=""
                                   langtag="info-suchasport">
                        </div>
                    </div>

                    <div class="form-group" id="target">
                        <label class="col-sm-2 control-label font-bold" langtag="word-target"></label>
                        <div class="col-sm-10">
                            <textarea class="form-control" name="target" rows="4" placeholder=""
                                      langtag="info-suchasiplist">{{.t.Target.TargetStr}}</textarea>
                            <span class="help-block m-b-none" langtag="info-targettunnel"></span>
                        </div>
                    </div>

                    <div class="form-group" id="access_path">
                        <label class="col-sm-2 control-label font-bold" langtag="word-accesspath"></label>
                        <div class="col-sm-10">
                            <input value="{{.t.AccessPath}}" class="form-control" type="text" name="access_path"
                                   placeholder="/ui">
                            <span class="help-block m-b-none" langtag="info-accesspath"></span>
                        </div>
                    </div>

                    <div class="form-group" id="https">
                        <label class="col-sm-2 control-label font-bold" langtag="word-https"></label>
                        <div class="col-sm-10">
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" name="https" value="true" {{if .t.Https}}checked{{end}}>
                                    <span langtag="info-https"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" id="username">
                        <label class="col-sm-2 control-label font-bold" langtag="word-username"></label>
                        <div class="col-sm-10">
                            <input value="{{if .t.MultiAccount}}{{range $k, $v := .t.MultiAccount.AccountMap}}{{$k}}{{end}}{{end}}"
                                   class="form-control" type="text" name="username" placeholder=""
                                   langtag="info-unrestricted">
                            <span class="help-block m-b-none" langtag="info-proxyaccount"></span>
                        </div>
                    </div>

                    <div class="form-group" id="password">
                        <label class="col-sm-2 control-label font-bold" langtag="word-password"></label>
                        <div class="col-sm-10">
                            <input value="{{if .t.MultiAccount}}{{range $k, $v := .t.MultiAccount.AccountMap}}{{$v}}{{end}}{{end}}"
                                   class="form-control" type="password" name="password" placeholder=""
                                   langtag="info-unrestricted">
                        </div>
                    </div>

                    <div class="hr-line-dashed"></div>
                    <div class="form-group">
                        <div class="col-sm-4 col-sm-offset-2">
                            <button class="btn btn-success" type="button"
                                    onclick="submitform('edit', '{{.web_base_url}}/index/edit', $('form').serializeArray())">
                                <i class="fa fa-fw fa-lg fa-check-circle"></i> <span langtag="word-save"></span>

                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
<script>
    var arr = []
    arr["all"] = ["client_id", "port", "target", "username", "password"]
    arr["tcp+udp"] = ["client_id", "port", "target", "access_path", "https"]
    arr["socks5"] = ["client_id", "port", "username", "password"]
    arr["httpProxy"] = ["client_id", "port", "username", "password"]

    // 与 add.html 完全一致：隧道的 Mode 只可能是 tcp+udp / httpProxy / socks5 三种。
    // TCP隧道 / UDP隧道 已弃用 —— 没有创建入口，存量也没有一条，所以这里不再为它们留字段。
    var KNOWN_MODES = {"tcp+udp": 1, "httpProxy": 1, "socks5": 1};

    function resetForm() {
        $(".form-group[id]").css("display", "none");
        // 模式值只从隐藏域的 value 属性读（会把实体还原），再归一化 + 过白名单。
        // 它决定显示哪些字段、以及提交上去存成什么 Mode，不能让认不出的字符串穿过去。
        o = String($("#type").val() || "").replace(/&#43;/g, "+").replace(/\s+/g, "+");
        o = $.trim(o);
        if (!KNOWN_MODES[o]) {
            o = "tcp+udp";
        }
        $("#type").val(o); // 干净的写回表单，提交上去的才是有效的 Mode
        for (var i = 0; i < arr[o].length; i++) {
            $("#" + arr[o][i]).css("display", "block")
        }
    }

    $(function () {
        // 不再从模板往脚本里塞值：隐藏域的 value 属性已经带着它了（属性里的实体浏览器会还原）。
        resetForm()
        $("#use_client").on("change", function () {
            resetForm()
        })

        getClientList()
    })

    function getClientList() {
        $("select[name='client_id']").empty();
        $.ajax({
            type: "POST",
            url: "{{.web_base_url}}/client/list", // 服务器数据的加载地址
            data: {order: "asc", offset: 0, limit: 999},
            dataType: "json",
            success: function (data) {
                if (data && data.rows.length > 0) {
                    for (var i = 0; i < data.rows.length; i++) {
                        var option = "<option value=\"" + data.rows[i].Id + "\"";
                        option += ">" + data.rows[i].Remark + "</option>"; //只显示备注名，取值仍是 Id
                        $("select[name='client_id']").append(option);
                        $("select[name='client_id']").find("option[value='{{.t.Client.Id}}']").attr("selected", true);
                    }
                }
            }
        });
    }
</script>
